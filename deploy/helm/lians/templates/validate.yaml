{{- if and .Values.config.metrics.enabled (eq (len .Values.networkPolicy.monitoring.namespaceSelector) 0) -}}
{{- fail "networkPolicy.monitoring.namespaceSelector cannot select every namespace" -}}
{{- end -}}
{{- if and .Values.otelCollector.enabled (eq (len .Values.otelCollector.producerNamespaceSelector) 0) -}}
{{- fail "otelCollector.producerNamespaceSelector cannot select every namespace" -}}
{{- end -}}
{{- range concat .Values.networkPolicy.postgresql.cidrs .Values.networkPolicy.redis.cidrs .Values.networkPolicy.externalHttpsCidrs -}}
{{- if or (contains $change .) (has . (list "0.0.0.0/0" "::/0")) -}}
{{- fail "PostgreSQL, Redis, and HTTPS NetworkPolicy CIDRs must be explicit and may not be world-open" -}}
{{- end -}}
{{- end -}}
{{- range .Values.networkPolicy.externalOtlp.cidrs -}}
{{- if or (contains $change .) (has . (list "0.0.0.0/0" "::/0")) -}}
{{- fail "external OTLP NetworkPolicy CIDRs must be explicit and may not be world-open" -}}
{{- end -}}
{{- end -}}
{{- if .Values.networkPolicy.vault.enabled -}}
{{- range .Values.networkPolicy.vault.cidrs -}}
{{- if or (contains $change .) (has . (list "0.0.0.0/0" "::/0")) -}}
{{- fail "Vault NetworkPolicy CIDRs must be explicit and may not be world-open" -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if .Values.backup.enabled -}}
{{- if eq (len .Values.backup.wormDestinationCidrs) 0 -}}
{{- fail "backup.enabled requires at least one explicit backup.wormDestinationCidrs entry" -}}
{{- end -}}
{{- range .Values.backup.wormDestinationCidrs -}}
{{- if or (contains $change .) (regexMatch "/0$" .) (has . (list "0.0.0.0/0" "::/0")) -}}
{{- fail "backup.wormDestinationCidrs must contain explicit reviewed provider endpoint CIDRs" -}}
{{- end -}}
{{- end -}}
{{- end -}}
