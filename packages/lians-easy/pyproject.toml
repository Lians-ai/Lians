[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "lians-bridge"
version = "0.5.0"
description = "Evidence-backed proof-of-done checks for AI coding agents"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
readme = "README.md"
authors = [{ name = "Lians" }]
keywords = ["ai", "agent-reliability", "proof-of-done", "verification", "completion-gate", "codex", "claude", "git"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "cryptography>=48.0.1",
  "pywebview==6.2.1; sys_platform == 'win32'",
]

[dependency-groups]
build = [
  "pyinstaller==6.22.0",
]

[project.urls]
Homepage = "https://www.lians.ai"
Documentation = "https://github.com/Lians-ai/Lians/blob/master/docs/easy-install.md"
Repository = "https://github.com/Lians-ai/Lians"
Issues = "https://github.com/Lians-ai/Lians/issues"

[project.scripts]
lians = "lians_easy.cli:main"
lians-bridge = "lians_easy.cli:main"
lians-easy = "lians_easy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["lians_easy"]
