[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lians-easy"
version = "0.5.0"
description = "One-click local memory for AI clients"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
readme = "README.md"
dependencies = ["cryptography>=48.0.1"]

[project.scripts]
lians-easy = "lians_easy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["lians_easy"]
