<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'"
    />
    <title>Lians</title>
    <link rel="icon" href="favicon.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="intro" class="intro" aria-hidden="true">
      <canvas id="intro-particles"></canvas>
    </div>

    <div id="content" class="app-shell">
      <div id="neural-field" class="neural-field" data-state="compressed" aria-hidden="true">
        <div class="brain-stage">
          <div class="brain-parallax">
            <div id="brain-orbit" class="brain-orbit">
              <svg class="ambient-brain" viewBox="0 0 1000 680" role="presentation">
                <path
                  class="brain-haze"
                  d="M500 126C450 82 369 82 316 123C245 113 180 155 164 219C101 248 78 320 111 375C83 437 121 505 188 523C214 586 289 612 350 579C395 619 467 602 500 547C533 602 605 619 650 579C711 612 786 586 812 523C879 505 917 437 889 375C922 320 899 248 836 219C820 155 755 113 684 123C631 82 550 82 500 126Z"
                />
                <path
                  class="brain-core"
                  d="M500 145C454 105 385 104 338 140C275 129 218 168 208 226C153 250 137 311 167 357C140 409 170 465 226 480C245 537 307 562 357 532C395 569 466 550 500 501C534 550 605 569 643 532C693 562 755 537 774 480C830 465 860 409 833 357C863 311 847 250 792 226C782 168 725 129 662 140C615 104 546 105 500 145Z"
                />
                <g class="brain-ridges">
                  <path d="M500 151C474 203 477 252 500 298C521 342 522 397 500 493" />
                  <path d="M451 139C405 174 397 216 424 249C446 275 438 311 399 332C357 355 348 400 374 438" />
                  <path d="M362 151C316 190 320 231 350 257C378 281 368 318 328 336C281 357 274 410 309 447" />
                  <path d="M282 186C247 223 257 260 286 282C310 300 302 334 266 353C229 373 226 418 251 449" />
                  <path d="M549 139C595 174 603 216 576 249C554 275 562 311 601 332C643 355 652 400 626 438" />
                  <path d="M638 151C684 190 680 231 650 257C622 281 632 318 672 336C719 357 726 410 691 447" />
                  <path d="M718 186C753 223 743 260 714 282C690 300 698 334 734 353C771 373 774 418 749 449" />
                  <path d="M392 489C424 466 457 469 500 502C543 469 576 466 608 489" />
                </g>
                <g class="brain-nodes">
                  <circle cx="350" cy="257" r="5" />
                  <circle cx="424" cy="249" r="4" />
                  <circle cx="328" cy="336" r="4" />
                  <circle cx="399" cy="332" r="5" />
                  <circle cx="650" cy="257" r="5" />
                  <circle cx="576" cy="249" r="4" />
                  <circle cx="672" cy="336" r="4" />
                  <circle cx="601" cy="332" r="5" />
                </g>
              </svg>
            </div>
          </div>
        </div>
      </div>
      <canvas id="ambient-canvas" class="ambient-canvas" aria-hidden="true"></canvas>
      <span id="brain-status" class="visually-hidden" role="status" aria-live="polite"></span>
      <header id="titlebar" class="topbar reveal">
        <div class="brand" aria-label="Lians">
          <span class="brand-mark" aria-hidden="true">
            <img src="lotus.png" width="40" height="40" alt="" />
          </span>
          <strong>Lians</strong>
        </div>
        <div class="window-actions">
          <button id="theme-toggle" class="theme-toggle control" type="button" data-icon="sun">
            <svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="3.6"></circle>
              <path d="M12 2.4v2.1M12 19.5v2.1M2.4 12h2.1M19.5 12h2.1M5.2 5.2l1.5 1.5M17.3 17.3l1.5 1.5M18.8 5.2l-1.5 1.5M6.7 17.3l-1.5 1.5"></path>
            </svg>
            <svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M19.7 15.4A8.2 8.2 0 0 1 8.6 4.3 8.3 8.3 0 1 0 19.7 15.4Z"></path>
            </svg>
          </button>
          <span class="action-divider" aria-hidden="true"></span>
          <button id="window-minimize" class="window-control" type="button" aria-label="Minimize">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10.5h10"></path></svg>
          </button>
          <button id="window-maximize" class="window-control" type="button" aria-label="Maximize or restore">
            <svg class="maximize-icon" viewBox="0 0 20 20" aria-hidden="true"><rect x="5.5" y="5.5" width="9" height="9" rx="1"></rect></svg>
            <svg class="restore-icon" viewBox="0 0 20 20" aria-hidden="true">
              <path d="M7.5 6.5V5.8c0-.7.6-1.3 1.3-1.3h5.4c.7 0 1.3.6 1.3 1.3v5.4c0 .7-.6 1.3-1.3 1.3h-.7"></path>
              <rect x="4.5" y="7.5" width="8" height="8" rx="1"></rect>
            </svg>
          </button>
          <button id="window-close" class="window-control close-control" type="button" aria-label="Close">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m6 6 8 8M14 6l-8 8"></path></svg>
          </button>
        </div>
      </header>

      <main>
        <section class="hero reveal">
          <div>
            <h1>Agent lifeline</h1>
            <p>Extended usage. Better memory.</p>
          </div>
          <div id="connection" class="connection" data-state="offline">
            <img id="connection-icon" width="34" height="34" alt="" hidden />
            <span id="connection-text">No connection detected</span>
          </div>
        </section>

        <section class="metric-rail reveal" aria-label="Lians totals">
          <article class="metric">
            <p id="tokens-label">Tokens saved</p>
            <strong id="tokens-value">~0</strong>
            <span id="tokens-detail">Repeated context removed</span>
          </article>
          <article class="metric">
            <p>Handoffs</p>
            <strong id="handoffs-value">0</strong>
            <span>Context carried forward</span>
          </article>
          <article class="metric">
            <p>Memories reused</p>
            <strong id="memory-value">0</strong>
            <span>Useful details returned</span>
          </article>
        </section>

        <section class="activity reveal">
          <div class="section-heading">
            <h2>Activity</h2>
            <span id="saved-memory-count">0 saved memories</span>
          </div>
          <div id="activity-list" class="activity-list">
            <div class="empty-state">
              <span class="waterline" aria-hidden="true"></span>
              <p>Waiting for the first handoff.</p>
            </div>
          </div>
        </section>
      </main>

      <footer class="footer reveal">
        <div class="footer-actions">
          <button id="refresh" class="control primary" type="button">Refresh</button>
        </div>
        <span class="local-note">Local. Encrypted.</span>
      </footer>

      <button id="lotus-pet" class="lotus-pet" type="button" aria-label="Lotus">
        <img src="lotus.png" width="58" height="58" alt="" />
      </button>

      <span class="resize-handle resize-top" data-edge="12"></span>
      <span class="resize-handle resize-right" data-edge="11"></span>
      <span class="resize-handle resize-bottom" data-edge="15"></span>
      <span class="resize-handle resize-left" data-edge="10"></span>
      <span class="resize-handle resize-top-left" data-edge="13"></span>
      <span class="resize-handle resize-top-right" data-edge="14"></span>
      <span class="resize-handle resize-bottom-left" data-edge="16"></span>
      <span class="resize-handle resize-bottom-right" data-edge="17"></span>
    </div>
    <script src="app.js" defer></script>
  </body>
</html>
