global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    environment: homelab
    product: lians

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: lians
    metrics_path: /metrics
    static_configs:
      - targets: [lians:8000]
        labels:
          component: api

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: alloy
    static_configs:
      - targets: [alloy:12345]

  - job_name: tempo
    static_configs:
      - targets: [tempo:3200]

  - job_name: loki
    static_configs:
      - targets: [loki:3100]
