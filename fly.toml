app            = 'agentmem-lotus'
primary_region = 'sjc'  # colocated with agentmem-lotus-db - cross-region DB chatter made writes ~2s

[build]
  dockerfile = "Dockerfile"

[processes]
  # One worker, not the image default of two: each worker loads its own copy of
  # the ~1.3GB sentence-transformers model, and 2×1.6GB OOM-loops a 2GB VM.
  app = "uvicorn lians.main:app --host 0.0.0.0 --port 8000 --workers 1"

[http_service]
  internal_port        = 8000
  force_https          = true
  auto_stop_machines   = 'stop'
  auto_start_machines  = true
  min_machines_running = 1
  processes            = ['app']

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 200
    soft_limit = 150

  [[http_service.checks]]
    grace_period = "420s"
    interval     = "15s"
    method       = "GET"
    path         = "/readyz"
    timeout      = "10s"

[env]
  DEPLOYMENT_ENVIRONMENT        = "production"
  # bge-large-en-v1.5 is baked into the image; "local" (hash projection) makes
  # semantic scores pure noise. Needs the 2GB VM below - the model is ~1.3GB.
  EMBEDDING_PROVIDER            = "sentence-transformers"
  SENTENCE_TRANSFORMER_MODEL    = "BAAI/bge-large-en-v1.5"
  SENTENCE_TRANSFORMER_REVISION = "d4aa6901d3a41ba39fb536a557fa166f842b0e09"
  SUPERSESSION_LLM_STAGE        = "false"
  RECALL_CACHE_ENABLED          = "true"
  RECALL_CACHE_TTL_SECONDS      = "60"
  SUPERSESSION_REVIEW_THRESHOLD = "0.75"
  OTEL_SERVICE_NAME             = "agentmem"
  LOG_JSON                      = "true"
  LOG_LEVEL                     = "INFO"
  RATE_LIMIT_PER_MINUTE         = "300"
  CORS_ORIGINS                  = "https://lians.ai,https://www.lians.ai"
  AIRGAP_MODE                   = "false"
  RETENTION_PRUNE_INTERVAL_HOURS = "24"
  # Public hosted MCP uses the stable mcp.lians.ai origin and per-user OAuth
  # subjects; issuer and JWKS endpoints are supplied as protected Fly secrets.
  HOSTED_MCP_ENABLED            = "true"
  HOSTED_MCP_RESOURCE_URL       = "https://mcp.lians.ai"
  HOSTED_MCP_SERVICE_DOCUMENTATION_URL = "https://www.lians.ai/privacy"
  HOSTED_MCP_RETENTION_DAYS     = "365"
  HOSTED_MCP_AUDIT_RETENTION_DAYS = "365"
  HOSTED_MCP_STARTUP_TIMEOUT_SECONDS = "360"
  HOSTED_MCP_TOOL_TIMEOUT_SECONDS = "30"
  HOSTED_MCP_MAX_CONCURRENT_INFERENCE = "1"
  HOSTED_MCP_INFERENCE_QUEUE_TIMEOUT_SECONDS = "0.1"
  HOSTED_MCP_RATE_LIMIT_PER_MINUTE = "60"
  HOSTED_MCP_MAX_MEMORIES_PER_TENANT = "10000"
  HOSTED_MCP_MAX_STORED_BYTES_PER_TENANT = "40000000"
  HOSTED_MCP_MAX_WRITE_BYTES_PER_DAY = "1000000"
  HOSTED_MCP_MAX_AUDIT_EVENTS_PER_DAY = "5000"
  HOSTED_MCP_TENANT_CLAIM       = "sub"
  HOSTED_MCP_MAX_TOKEN_LIFETIME_SECONDS = "3600"

[[vm]]
  cpu_kind  = 'shared'
  cpus      = 2   # bge-large CPU inference - 1 shared core made writes ~6s
  memory    = '2gb'
  memory_mb = 2048
