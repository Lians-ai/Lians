[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "lians-platform"
version = "0.5.0"
description = "Lians — decision evidence infrastructure for consequential AI actions"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "ai-infrastructure",
    "decision-evidence",
    "agent-governance",
    "audit-trail",
    "bitemporal",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "redis[hiredis]>=5.0.0",
    "cryptography>=42.0.0",
    "pyjwt[crypto]>=2.13.0",
    "voyageai>=0.2.3",
    "openai>=1.30.0",
    "anthropic>=0.103.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pgvector>=0.3.0",
    "numpy>=1.26.0",
    "tiktoken>=0.7.0",
    "tokenizers>=0.20.0",
    "opentelemetry-proto>=1.24.0",
    "protobuf>=4.25.0",
]

[project.scripts]
lians-receipt = "lians.receipt_cli:main"
lians-gate-mediator = "lians.gate_mediator.cli:main"

[project.urls]
Homepage = "https://www.lians.ai"
Repository = "https://github.com/Lians-ai/Lians"
Documentation = "https://github.com/Lians-ai/Lians/tree/master/docs"
Issues = "https://github.com/Lians-ai/Lians/issues"

[project.optional-dependencies]
# Self-hosted embeddings — no external API calls, suitable for air-gapped deployments.
# Default model BAAI/bge-large-en-v1.5 requires ~1.3 GB disk; downloaded on first use.
# For fully offline use, pre-download the model and set SENTENCE_TRANSFORMER_MODEL=/path.
local = [
    "sentence-transformers>=3.0.0",
]
langchain = ["langchain-core>=0.2.0"]
mcp = ["mcp>=1.0.0", "httpx>=0.27.0"]
billing = ["stripe>=8.10.0"]
otel = [
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.45b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24.0",
]
otel-receiver = [
    "opentelemetry-proto>=1.24.0",
    "protobuf>=4.25.0",
]
metrics = [
    "prometheus-client>=0.20.0",
]
aws = [
    "boto3>=1.43.62",
]
azure = [
    "azure-identity>=1.25.3",
    "azure-keyvault-secrets>=4.11.0",
]
vault = [
    "hvac>=2.4.0",
]
# Self-contained release image: all runtime controls advertised by the
# production manifests are importable regardless of the selected cloud KMS.
production = [
    "sentence-transformers>=3.0.0",
    "stripe>=8.10.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.45b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24.0",
    "prometheus-client>=0.20.0",
    "boto3>=1.43.62",
    "azure-identity>=1.25.3",
    "azure-keyvault-secrets>=4.11.0",
    "hvac>=2.4.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "ruff>=0.16.1,<0.17",
    "check-jsonschema>=0.36.0,<0.37",
    "pyyaml>=6.0.2,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["agentmem/src/lians"]

[tool.hatch.build.targets.wheel.force-include]
"specs" = "lians/specs"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["agentmem/tests"]
pythonpath = ["agentmem/src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Ruff 0.16 expanded its implicit defaults.  Pin the repository's CI contract
# so a linter upgrade cannot silently enable hundreds of style migrations and
# make release checks dependent on tool-version defaults.
select = ["E4", "E7", "E9", "F"]
