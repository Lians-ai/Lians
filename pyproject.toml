[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lians"
version = "0.5.0"
description = "Local-first, provider-neutral memory for any AI agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.14.2",
    "redis[hiredis]>=5.0.0",
    "cryptography>=48.0.1",
    "voyageai>=0.2.3",
    "openai>=1.30.0",
    "anthropic>=0.103.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pgvector>=0.3.0",
    "numpy>=1.26.0",
    "mcp>=1.28.1,<2",
    "PyJWT[crypto]>=2.10,<3",
]

[project.optional-dependencies]
# Self-hosted embeddings — no external API calls, suitable for air-gapped deployments.
# Default model BAAI/bge-large-en-v1.5 requires ~1.3 GB disk; downloaded on first use.
# For fully offline use, pre-download the model and set SENTENCE_TRANSFORMER_MODEL=/path.
local = [
    "sentence-transformers>=3.0.0",
]
langchain = ["langchain-core>=0.2.0"]
# Compatibility marker for existing `.[mcp]` installs. MCP and JWT resource-
# server support are base dependencies because the production API mounts them.
mcp = []
billing = ["stripe>=7.0.0"]
otel = [
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.45b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24.0",
]
otel-receiver = [
    "opentelemetry-proto>=1.24.0",
    "protobuf>=4.25.0",
]
metrics = [
    "prometheus-client>=0.20.0",
]
aws = ["boto3>=1.34,<2"]
azure = [
    "azure-identity>=1.16,<2",
    "azure-keyvault-secrets>=4.8,<5",
]
vault = ["hvac>=2.1,<3"]
# Operator image surface: metering, metrics, tracing, and all supported KMS
# clients, without the multi-gigabyte local embedding model.
enterprise = [
    "stripe>=7.0.0",
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.45b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24.0",
    "boto3>=1.34,<2",
    "azure-identity>=1.16,<2",
    "azure-keyvault-secrets>=4.8,<5",
    "hvac>=2.1,<3",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.9.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "opentelemetry-proto>=1.24.0",
    "protobuf>=4.25.0",
]

[project.scripts]
lians-worker = "lians.worker:main"
lians-verify-evidence = "lians.evidence_signing:main"

[tool.hatch.build.targets.wheel]
packages = ["agentmem/src/lians"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["agentmem/tests"]
pythonpath = ["agentmem/sdk/python", "agentmem/src", "agentmem"]

[tool.ruff]
line-length = 100
