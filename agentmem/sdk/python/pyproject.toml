[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "lians-sdk"
version = "0.5.0"
description = "Provider-neutral decision evidence, runtime control, reconstruction, and bitemporal memory for consequential AI systems"
requires-python = ">=3.11"
license = { file = "LICENSE" }
readme = "README.md"
keywords = ["ai-infrastructure", "decision-evidence", "agent-governance", "agent-memory", "mcp", "opentelemetry", "audit-trail", "bitemporal", "gdpr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Financial",
]
dependencies = ["httpx>=0.25"]

[project.optional-dependencies]
langchain     = ["langchain-core>=0.2"]
langgraph     = ["langchain-core>=0.2", "langgraph>=0.1"]
crewai        = ["crewai>=1.0.0"]
openai-agents = ["openai-agents>=0.0.1"]
autogen       = ["autogen-core>=0.4"]
anthropic     = ["anthropic>=0.120.2,<1"]
google-adk    = ["google-adk>=2.6.1,<3"]
bge-onnx     = [
    "sqlalchemy>=2.0",
    "greenlet>=3.0",
    "aiosqlite>=0.19",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "cryptography>=42",
    "pgvector>=0.2.5",
    "numpy>=1.26",
    "fastapi>=0.110",
    "asyncpg>=0.29",
    "onnxruntime>=1.20,<2",
    "tokenizers>=0.20,<1",
]
local         = [
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "cryptography>=42",
    "pgvector>=0.2.5",
    "numpy>=1.26",
    "fastapi>=0.110",
    # engine's db module builds its (unused-in-local-mode) default engine at
    # import time, which requires the asyncpg dialect to be importable
    "asyncpg>=0.29",
    # LocalLiansClient defaults to this provider when it is installed. Keep it
    # in the local extra so the documented install never falls back to the
    # deterministic test-grade embedding stub.
    "sentence-transformers>=3.0",
    # Optional dependency-light cross-encoder runtime. The feature remains
    # off until RECALL_RERANKER_ONNX_MODEL points at an exported local graph.
    "onnxruntime>=1.20,<2",
    "tokenizers>=0.20,<1",
]
mcp           = [
    "mcp>=1.0.0,<2",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "cryptography>=42",
    "pgvector>=0.2.5",
    "numpy>=1.26",
    "fastapi>=0.110",
    "asyncpg>=0.29",
    "sentence-transformers>=3.0",
    "onnxruntime>=1.20,<2",
    "tokenizers>=0.20,<1",
]
all           = [
    "lians-sdk[langchain,langgraph,crewai,openai-agents,autogen,anthropic,google-adk,bge-onnx,local,mcp]",
]

[project.scripts]
lians-mcp = "lians.mcp_server:main"
lians-memory-mcp = "lians.memory_plugin_mcp:main"
lians-bge-onnx-export = "lians.bge_onnx_export:main"

[project.urls]
Homepage      = "https://www.lians.ai"
Repository    = "https://github.com/Lians-ai/Lians"
Documentation = "https://github.com/Lians-ai/Lians/tree/master/docs"
Changelog     = "https://github.com/Lians-ai/Lians/releases"
Issues        = "https://github.com/Lians-ai/Lians/issues"
Benchmarks    = "https://github.com/Lians-ai/Lians/blob/master/docs/benchmark.md"
MCP           = "https://github.com/Lians-ai/Lians#mcp---native-tool-in-any-ai-client"

[tool.hatch.build.targets.wheel]
packages = ["lians"]

# Vendor the service engine so LocalLiansClient works from an installed
# wheel (zero-setup local mode), not just a monorepo checkout. The SDK
# aliases lians_engine.lians -> src.lians at import time. The wheel include
# is a custom hook (hatch_build.py) because `python -m build` builds the
# wheel FROM THE SDIST, where ../../src/lians doesn't exist. The hook picks
# the engine up from the sdist's own vendored copy in that case.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist.force-include]
"../../src/lians" = "lians_engine/lians"
"_engine_init.py" = "lians_engine/__init__.py"

[tool.hatch.build]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
