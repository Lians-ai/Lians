[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lians-sdk"
version = "0.5.0"
description = "Local-first, provider-neutral memory for AI agents"
requires-python = ">=3.10"
license = { file = "LICENSE" }
readme = "README.md"
keywords = ["ai", "agent-memory", "long-term-memory", "ai-agents", "llm", "mcp", "local-first", "langchain", "langgraph", "crewai", "bitemporal", "audit-trail"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["httpx>=0.28.1"]

[project.optional-dependencies]
langchain     = ["langchain-core>=1.5.3"]
langgraph     = ["langchain-core>=1.5.3", "langgraph>=1.2.10"]
crewai        = ["crewai>=1.15.14"]
openai-agents = ["openai-agents>=0.19.4"]
autogen       = ["autogen-core>=0.7.5"]
local         = [
    "sqlalchemy[asyncio]>=2.0.51",
    "aiosqlite>=0.22.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "cryptography>=50.0.0",
    "pgvector>=0.5.0",
    "numpy>=2.2.6",
    "fastapi>=0.141.1",
    # engine's db module builds its (unused-in-local-mode) default engine at
    # import time, which requires the asyncpg dialect to be importable
    "asyncpg>=0.31.0",
    # LocalLiansClient defaults to this provider when it is installed. Keep it
    # in the local extra so the documented install never falls back to the
    # deterministic test-grade embedding stub.
    "sentence-transformers>=5.7.0",
]
bge-onnx      = [
    "sqlalchemy[asyncio]>=2.0.51",
    "aiosqlite>=0.22.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "cryptography>=50.0.0",
    "pgvector>=0.5.0",
    "numpy>=2.2.6",
    "fastapi>=0.141.1",
    "asyncpg>=0.31.0",
    "onnxruntime>=1.24.3,<2",
    "tokenizers>=0.23.1,<1",
]
mcp           = [
    "mcp>=2.0.0,<3",
    "httpx>=0.28.1",
    "sqlalchemy[asyncio]>=2.0.51",
    "aiosqlite>=0.22.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "cryptography>=50.0.0",
    "pgvector>=0.5.0",
    "numpy>=2.2.6",
    "fastapi>=0.141.1",
    "asyncpg>=0.31.0",
    "sentence-transformers>=5.7.0",
]
all           = [
    "lians-sdk[langchain,langgraph,crewai,openai-agents,autogen,local,bge-onnx,mcp]",
]

[project.scripts]
lians-mcp = "lians.mcp_server:main"
lians-memory-mcp = "lians.memory_plugin_mcp:main"
lians-bge-onnx-export = "lians.bge_onnx_export:main"

[project.urls]
Homepage      = "https://www.lians.ai"
Repository    = "https://github.com/Lians-ai/Lians"
Documentation = "https://github.com/Lians-ai/Lians/tree/master/docs"
Changelog     = "https://github.com/Lians-ai/Lians/releases"
Issues        = "https://github.com/Lians-ai/Lians/issues"
Benchmarks    = "https://github.com/Lians-ai/Lians/blob/master/docs/benchmark.md"
MCP           = "https://github.com/Lians-ai/Lians#mcp---native-tool-in-any-ai-client"

[tool.hatch.build.targets.wheel]
packages = ["lians"]

# Vendor the service engine so LocalLiansClient works from an installed
# wheel (zero-setup local mode), not just a monorepo checkout. The SDK
# aliases lians_engine.lians -> src.lians at import time. The wheel include
# is a custom hook (hatch_build.py) because `python -m build` builds the
# wheel FROM THE SDIST, where ../../src/lians doesn't exist. The hook picks
# the engine up from the sdist's own vendored copy in that case.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist.force-include]
"../../src/lians" = "lians_engine/lians"
"_engine_init.py" = "lians_engine/__init__.py"

[tool.hatch.build]
exclude = ["**/__pycache__", "**/*.pyc"]
