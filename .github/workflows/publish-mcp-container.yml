name: Publish MCP container

on:
  workflow_dispatch:
    inputs:
      version:
        description: Container version tag
        required: true
        default: 0.5.0
  push:
    tags:
      - "v*"

concurrency:
  group: publish-mcp-container-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/lians-ai/lians-mcp

jobs:
  policy:
    name: Authorize source revision
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    outputs:
      version: ${{ steps.policy.outputs.version }}
    steps:
      - name: Check out source and default-branch history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fail closed on an unapproved publication ref
        id: policy
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            push)
              [[ "$REF" == refs/tags/v* ]]
              test "$REF_PROTECTED" = true
              git show-ref --verify "refs/remotes/origin/$DEFAULT_BRANCH"
              git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"
              version="${GITHUB_REF_NAME#v}"
              ;;
            workflow_dispatch)
              test "$REF" = "refs/heads/$DEFAULT_BRANCH"
              version="$REQUESTED_VERSION"
              ;;
            *)
              echo "Unsupported publication event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac
          test -n "$version"
          python .github/scripts/check_release_versions.py "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-and-scan:
    name: Build, scan, and smoke ${{ matrix.platform }}
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            slug: linux-amd64
          - platform: linux/arm64
            slug: linux-arm64
    steps:
      - name: Check out authorized source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Authenticate staging publication to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Stage the release payload once by immutable digest
        id: staged
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.glama
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: PREDOWNLOAD_MODEL=
          labels: |
            org.opencontainers.image.title=Lians MCP server
            org.opencontainers.image.description=Local or remote Lians tools over Model Context Protocol
            org.opencontainers.image.vendor=Lians
            org.opencontainers.image.revision=${{ github.sha }}
          # Keep the scanned subject a plain single-platform manifest. SBOM and
          # provenance evidence bind the exact promoted two-platform index.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=mcp-${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=mcp-${{ matrix.slug }}
      - name: Select the exact scan subject
        id: subject
        shell: bash
        env:
          DIGEST: ${{ steps.staged.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "value=${IMAGE_NAME}@${DIGEST}" >> "$GITHUB_OUTPUT"
      - name: Reject high and critical vulnerabilities in the exact payload
        id: scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ${{ steps.subject.outputs.value }}
          fail-build: true
          severity-cutoff: high
          output-format: sarif
          only-fixed: false
      - name: Upload platform vulnerability findings
        if: ${{ always() && steps.scan.outputs.sarif != '' }}
        uses: github/codeql-action/upload-sarif@ea14db8afdef5d462e69d78c4ca45002d4522418 # v4.37.4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: lians-mcp-image-${{ matrix.slug }}
      - name: Set up Python for exact-payload MCP smoke test
        if: ${{ matrix.platform == 'linux/amd64' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv for exact-payload MCP smoke test
        if: ${{ matrix.platform == 'linux/amd64' }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Initialize the exact staged server and list tools
        if: ${{ matrix.platform == 'linux/amd64' }}
        env:
          SUBJECT: ${{ steps.subject.outputs.value }}
        run: |
          set -euo pipefail
          uv sync --locked --extra mcp
          docker pull "$SUBJECT"
          docker tag "$SUBJECT" lians-mcp-glama:test
          uv run --no-sync python .github/scripts/smoke_mcp_container.py
      - name: Record the scanned immutable platform digest
        shell: bash
        env:
          DIGEST: ${{ steps.staged.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/platform-digest"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/platform-digest/${{ matrix.slug }}.digest"
          printf '%s\n' "$PLATFORM" > "$RUNNER_TEMP/platform-digest/${{ matrix.slug }}.platform"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/platform-digest/${{ matrix.slug }}.source-sha"
          (cd "$RUNNER_TEMP/platform-digest" && \
            sha256sum \
              "${{ matrix.slug }}.digest" \
              "${{ matrix.slug }}.platform" \
              "${{ matrix.slug }}.source-sha" \
              > "${{ matrix.slug }}.sha256")
      - name: Transfer the scanned digest to promotion
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lians-mcp-platform-${{ matrix.slug }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/platform-digest
          if-no-files-found: error
          retention-days: 1

  promote:
    name: Promote, attest, and sign scanned MCP manifest
    needs: [policy, build-and-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out authorized source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download only this revision's scanned platform digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: lians-mcp-platform-*-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/platform-digests
          merge-multiple: true
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Authenticate promotion to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate immutable and release aliases
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ needs.policy.outputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Compose only the scanned payloads and verify the exact index
        id: manifest
        shell: bash
        env:
          METADATA_JSON: ${{ steps.metadata.outputs.json }}
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/platform-digests"
          expected=(linux-amd64 linux-arm64)
          references=()
          amd64_digest=""
          arm64_digest=""
          for slug in "${expected[@]}"; do
            digest_file="$directory/$slug.digest"
            platform_file="$directory/$slug.platform"
            source_file="$directory/$slug.source-sha"
            checksum_file="$directory/$slug.sha256"
            test -f "$digest_file" -a -f "$platform_file" -a -f "$source_file" -a -f "$checksum_file"
            (cd "$directory" && sha256sum --check --strict "$slug.sha256")
            digest="$(tr -d '\r\n' < "$digest_file")"
            platform="$(tr -d '\r\n' < "$platform_file")"
            source_sha="$(tr -d '\r\n' < "$source_file")"
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            test "$source_sha" = "$GITHUB_SHA"
            test "$platform" = "${slug/-//}"
            references+=("${IMAGE_NAME}@${digest}")
            case "$platform" in
              linux/amd64) amd64_digest="$digest" ;;
              linux/arm64) arm64_digest="$digest" ;;
              *) exit 1 ;;
            esac
          done
          test "$(find "$directory" -type f -name '*.digest' | wc -l)" -eq 2
          test "$(find "$directory" -type f -name '*.sha256' | wc -l)" -eq 2
          mapfile -t tags < <(jq -er '.tags[]' <<< "$METADATA_JSON")
          test "${#tags[@]}" -gt 0
          tag_arguments=()
          for tag in "${tags[@]}"; do
            [[ "$tag" == "$IMAGE_NAME:"* ]]
            tag_arguments+=(--tag "$tag")
          done
          metadata="$RUNNER_TEMP/release-index.metadata.json"
          docker buildx imagetools create \
            --metadata-file "$metadata" \
            "${tag_arguments[@]}" "${references[@]}"
          digest="$(jq -er '."containerimage.descriptor".digest' "$metadata")"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          raw_manifest="$RUNNER_TEMP/release-index.json"
          docker buildx imagetools inspect "${IMAGE_NAME}@${digest}" --raw > "$raw_manifest"
          jq -e --arg amd64 "$amd64_digest" --arg arm64 "$arm64_digest" '
            .manifests as $items
            | ($items | length) == 2
            and ($items | map(select(
              .digest == $amd64
              and .platform.os == "linux"
              and .platform.architecture == "amd64"
            )) | length) == 1
            and ($items | map(select(
              .digest == $arm64
              and .platform.os == "linux"
              and .platform.architecture == "arm64"
            )) | length) == 1
          ' "$raw_manifest" >/dev/null
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Generate SPDX SBOM for the promoted immutable index
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.manifest.outputs.digest }}
          format: spdx-json
          output-file: lians-mcp-${{ github.sha }}.spdx.json
          artifact-name: lians-mcp-${{ github.sha }}-attempt-${{ github.run_attempt }}.spdx.json
          upload-artifact: true
          upload-release-assets: false
      - name: Attest exact promoted-index provenance
        if: ${{ vars.LIANS_ATTESTATIONS_ENABLED != 'false' }}
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
      - name: Attest exact promoted-index SBOM
        if: ${{ vars.LIANS_ATTESTATIONS_ENABLED != 'false' }}
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          sbom-path: lians-mcp-${{ github.sha }}.spdx.json
          push-to-registry: true
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign only the exact promoted index digest
        env:
          SUBJECT: ${{ env.IMAGE_NAME }}@${{ steps.manifest.outputs.digest }}
        run: cosign sign --yes "$SUBJECT"
      - name: Re-verify exact signature and provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUBJECT: ${{ env.IMAGE_NAME }}@${{ steps.manifest.outputs.digest }}
          REPOSITORY: ${{ github.repository }}
          LIANS_ATTESTATIONS_ENABLED: ${{ vars.LIANS_ATTESTATIONS_ENABLED }}
        run: |
          set -euo pipefail
          cosign verify "$SUBJECT" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity "https://github.com/${REPOSITORY}/.github/workflows/publish-mcp-container.yml@${GITHUB_REF}"
          if [[ "${LIANS_ATTESTATIONS_ENABLED:-true}" != false ]]; then
            gh attestation verify "oci://${SUBJECT}" \
              --repo "$REPOSITORY" \
              --signer-workflow "${REPOSITORY}/.github/workflows/publish-mcp-container.yml" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          fi
      - name: Publish verification summary
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          {
            echo "## Lians MCP image"
            echo
            echo "Exact payloads scanned and smoke-tested, then promoted, signed, and re-verified: \`${IMAGE_NAME}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
