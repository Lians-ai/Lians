name: Build Lians Easy

on:
  pull_request:
    paths:
      - "packages/lians-easy/**"
      - ".github/workflows/build-lians-easy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install packages/lians-easy pytest==8.4.1
      - run: python -m pytest packages/lians-easy/tests -q
        env:
          PYTHONPATH: packages/lians-easy
      - run: python packages/lians-easy/benchmarks/token_reduction.py
        env:
          PYTHONPATH: packages/lians-easy

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: LiansMemory-windows
          - os: macos-15
            artifact: LiansMemory-macos-arm64
            macos_architecture: arm64
          - os: macos-15-intel
            artifact: LiansMemory-macos-x86_64
            macos_architecture: x86_64
          - os: ubuntu-latest
            artifact: LiansMemory-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install packages/lians-easy pyinstaller==6.22.0
      - name: Install pinned desktop packaging dependency
        if: runner.os == 'macOS' || runner.os == 'Linux'
        run: python -m pip install Pillow==11.3.0
      - name: Verify consumer layout at common Windows scaling
        if: runner.os == 'Windows'
        run: |
          python -m pip install pytest==8.4.1
          python -m pytest packages/lians-easy/tests/test_gui_layout.py -q
        env:
          PYTHONPATH: packages/lians-easy
      - name: Build frozen Bridge artifact
        shell: bash
        run: |
          data_separator=":"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            data_separator=";"
          fi
          extra_args=(
            --add-data "packages/lians-easy/lians_easy/app${data_separator}lians_easy/app"
          )
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            extra_args+=(
              --icon packages/lians-easy/windows-lians.ico
              --version-file packages/lians-easy/windows-version-info.txt
            )
          fi
          python -m PyInstaller --noconfirm --clean --onefile \
            --name LiansMemory \
            --paths packages/lians-easy \
            "${extra_args[@]}" \
            packages/lians-easy/entrypoint.py
      - name: Verify frozen Lians App and Bridge API
        run: >-
          python packages/lians-easy/tests/artifact_app_smoke.py
          --binary dist/LiansMemory${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Verify Windows package identity
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $info = (Get-Item -LiteralPath dist/LiansMemory.exe).VersionInfo
          $versionLine = Select-String -LiteralPath packages/lians-easy/pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $versionLine -or $versionLine.Line -notmatch '^version\s*=\s*"([^"]+)"') {
            throw 'Could not read the Lians Bridge package version'
          }
          $packageVersion = $Matches[1]
          $expected = @{
            CompanyName = 'Lians'
            FileDescription = 'Lians Bridge local AI memory'
            LegalCopyright = 'Copyright 2026 Lians'
            ProductName = 'Lians Bridge'
            OriginalFilename = 'LiansMemory.exe'
            FileVersion = $packageVersion
            ProductVersion = $packageVersion
          }
          foreach ($field in $expected.Keys) {
            if ($info.$field -ne $expected[$field]) {
              throw "$field was '$($info.$field)'; expected '$($expected[$field])'"
            }
          }
          $info | Select-Object CompanyName,FileDescription,ProductName,FileVersion,ProductVersion,OriginalFilename,LegalCopyright
      - name: Verify frozen installer crash recovery on Windows
        if: runner.os == 'Windows'
        run: >-
          python packages/lians-easy/tests/artifact_crash_smoke.py
          --binary dist/LiansMemory.exe
      - name: Verify frozen installer crash recovery on macOS and Linux
        if: runner.os != 'Windows'
        run: >-
          python packages/lians-easy/tests/artifact_crash_smoke.py
          --binary dist/LiansMemory
      - name: Install pinned Linux AppImage tool
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/appimagetool-x86_64.AppImage"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage \
            --output "$tool"
          printf '%s  %s\n' \
            ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0 \
            "$tool" | sha256sum --check --strict
          chmod 0755 "$tool"
          runtime="$RUNNER_TEMP/appimage-runtime-x86_64"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64 \
            --output "$runtime"
          printf '%s  %s\n' \
            2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d \
            "$runtime" | sha256sum --check --strict
          echo "LIANS_APPIMAGETOOL=$tool" >> "$GITHUB_ENV"
          echo "LIANS_APPIMAGE_RUNTIME=$runtime" >> "$GITHUB_ENV"
      - name: Build install-free Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          version="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("packages/lians-easy/pyproject.toml").read_text())["project"]["version"])')"
          python packages/lians-easy/scripts/create_macos_icon.py \
            --source packages/lians-easy/windows-lians.ico \
            --output dist/linux-iconset
          bash packages/lians-easy/scripts/build_linux_appimage.sh \
            --binary dist/LiansMemory \
            --icon dist/linux-iconset/icon_256x256.png \
            --output-directory dist/installer \
            --version "$version" \
            --architecture x86_64 \
            --appimagetool "$LIANS_APPIMAGETOOL" \
            --runtime-file "$LIANS_APPIMAGE_RUNTIME"
      - name: Verify extracted Linux AppImage and encrypted Bridge
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("packages/lians-easy/pyproject.toml").read_text())["project"]["version"])')"
          python packages/lians-easy/tests/artifact_linux_appimage_smoke.py \
            --appimage "dist/installer/Lians-$version-linux-x86_64.AppImage" \
            --expected-version "$version" \
            --expected-architecture x86_64
      - name: Build native macOS drag-and-drop package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("packages/lians-easy/pyproject.toml").read_text())["project"]["version"])')"
          bash packages/lians-easy/scripts/build_macos_dmg.sh \
            --binary dist/LiansMemory \
            --output-directory dist/installer \
            --version "$version" \
            --architecture "${{ matrix.macos_architecture }}"
      - name: Verify mounted macOS package and installed Bridge
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("packages/lians-easy/pyproject.toml").read_text())["project"]["version"])')"
          python packages/lians-easy/tests/artifact_macos_dmg_smoke.py \
            --dmg "dist/installer/Lians-$version-macos-${{ matrix.macos_architecture }}.dmg" \
            --expected-version "$version" \
            --expected-architecture "${{ matrix.macos_architecture }}"
      - name: Install pinned Windows packaging tool
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis.install --version=3.12.0 --yes --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "NSIS installation failed with exit code $LASTEXITCODE"
          }
          $nsisCompiler = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path -LiteralPath $nsisCompiler)) {
            throw "NSIS compiler was not installed at the expected path: $nsisCompiler"
          }
          $nsisVersion = (& $nsisCompiler /VERSION).Trim()
          if ($nsisVersion -ne 'v3.12') {
            throw "Expected NSIS v3.12; found '$nsisVersion'"
          }
      - name: Build per-user Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          & packages/lians-easy/scripts/build_windows_installer.ps1
          -Binary dist/LiansMemory.exe
          -OutputDirectory dist/installer
      - name: Verify install, bundled app, and memory-preserving removal
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $versionLine = Select-String -LiteralPath packages/lians-easy/pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $versionLine -or $versionLine.Line -notmatch '^version\s*=\s*"([^"]+)"') {
            throw 'Could not read the Lians Bridge package version'
          }
          $version = $Matches[1]
          python packages/lians-easy/tests/artifact_windows_installer_smoke.py `
            --installer "dist/installer/Lians-Setup-$version.exe" `
            --expected-version $version
      - name: Prepare interrupted state for a fresh Windows runner
        if: runner.os == 'Windows'
        run: >-
          python packages/lians-easy/tests/artifact_crash_smoke.py
          --phase prepare
          --binary dist/LiansMemory.exe
          --fixture .lians-cold-restart
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: runner.os == 'Windows'
        with:
          name: LiansMemory-cold-restart-state
          path: |
            dist/LiansMemory.exe
            .lians-cold-restart
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/LiansMemory*
            dist/installer/Lians-Setup-*.exe
            dist/installer/Lians-*.dmg
            dist/installer/Lians-*.AppImage
          if-no-files-found: error

  cold-restart:
    name: Recover setup on a fresh Windows runner
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: LiansMemory-cold-restart-state
          path: .
      - run: >-
          python packages/lians-easy/tests/artifact_crash_smoke.py
          --phase resume
          --binary dist/LiansMemory.exe
          --fixture .lians-cold-restart
