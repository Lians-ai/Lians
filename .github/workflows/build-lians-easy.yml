name: Build Lians Easy

on:
  pull_request:
    paths:
      - "packages/lians-easy/**"
      - ".github/workflows/build-lians-easy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest==8.4.1
      - run: python -m pytest packages/lians-easy/tests -q
        env:
          PYTHONPATH: packages/lians-easy

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: LiansMemory-windows
          - os: macos-latest
            artifact: LiansMemory-macos
          - os: ubuntu-latest
            artifact: LiansMemory-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller==6.22.0
      - run: >-
          python -m PyInstaller --noconfirm --clean --onefile
          --name LiansMemory
          --paths packages/lians-easy
          packages/lians-easy/entrypoint.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.artifact }}
          path: dist/LiansMemory*
          if-no-files-found: error
