name: Build Lians Easy

on:
  pull_request:
    paths:
      - "packages/lians-easy/**"
      - ".github/workflows/build-lians-easy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install packages/lians-easy pytest==8.4.1
      - run: python -m pytest packages/lians-easy/tests -q
        env:
          PYTHONPATH: packages/lians-easy
      - run: python packages/lians-easy/benchmarks/token_reduction.py
        env:
          PYTHONPATH: packages/lians-easy

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: LiansMemory-windows
          - os: macos-latest
            artifact: LiansMemory-macos
          - os: ubuntu-latest
            artifact: LiansMemory-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install packages/lians-easy pyinstaller==6.22.0
      - run: >-
          python -m PyInstaller --noconfirm --clean --onefile
          --name LiansMemory
          --paths packages/lians-easy
          packages/lians-easy/entrypoint.py
      - name: Verify frozen installer crash recovery on Windows
        if: runner.os == 'Windows'
        run: >-
          python packages/lians-easy/tests/artifact_crash_smoke.py
          --binary dist/LiansMemory.exe
      - name: Verify frozen installer crash recovery on macOS and Linux
        if: runner.os != 'Windows'
        run: >-
          python packages/lians-easy/tests/artifact_crash_smoke.py
          --binary dist/LiansMemory
      - name: Prepare interrupted state for a fresh Windows runner
        if: runner.os == 'Windows'
        run: >-
          python packages/lians-easy/tests/artifact_crash_smoke.py
          --phase prepare
          --binary dist/LiansMemory.exe
          --fixture .lians-cold-restart
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: runner.os == 'Windows'
        with:
          name: LiansMemory-cold-restart-state
          path: |
            dist/LiansMemory.exe
            .lians-cold-restart
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.artifact }}
          path: dist/LiansMemory*
          if-no-files-found: error

  cold-restart:
    name: Recover setup on a fresh Windows runner
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: LiansMemory-cold-restart-state
          path: .
      - run: >-
          python packages/lians-easy/tests/artifact_crash_smoke.py
          --phase resume
          --binary dist/LiansMemory.exe
          --fixture .lians-cold-restart
