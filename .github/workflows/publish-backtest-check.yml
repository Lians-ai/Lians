name: Publish agentmem-backtest-check to PyPI

# Trigger: push a tag named backtest-check-v<semver>, e.g. backtest-check-v0.1.0
#
# Setup required (one-time, on PyPI):
# 1. Go to https://pypi.org/manage/project/agentmem-backtest-check/settings/publishing/
# 2. Add a "trusted publisher" for this GitHub repo:
# - Owner:      <your-github-org-or-username>
# - Repository: AI_Memory_Software_lotus
# - Workflow:   publish-backtest-check.yml
# - Environment: pypi
# No API token or secret needed — OIDC trusted publishing handles auth.

on:
  push:
    tags:
      - "backtest-check-v*"

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Authorize protected publication source
        env:
          LIANS_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          LIANS_REF_PROTECTED: ${{ github.ref_protected }}
        run: python .github/scripts/check_publish_source.py

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"

      - name: Require the tag to match package metadata
        shell: bash
        run: |
          expected="${GITHUB_REF_NAME#backtest-check-v}"
          actual="$(python -c 'import tomllib; print(tomllib.load(open("packages/agentmem-backtest-check/pyproject.toml", "rb"))["project"]["version"])')"
          test "$expected" = "$actual"

      - name: Build hash-verified sdist and wheel
        run: >-
          uv build packages/agentmem-backtest-check
          --build-constraint build-constraints.lock
          --require-hashes
          --out-dir dist

      - name: Upload dist as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/agentmem-backtest-check/

    permissions:
      id-token: write  # required for OIDC trusted publishing

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
