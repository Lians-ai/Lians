name: Release SDK artifacts

# Cut a release by pushing a semver tag (e.g. v0.2.1). Builds the language
# artifacts and attaches them to the GitHub Release. Python and npm have their
# own publish workflows; this covers Java (jar) and C (source tarball), and
# sanity-builds Go. See docs/publishing.md.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  version-contract:
    name: Verify unified release version
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Authorize protected publication source
        env:
          LIANS_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          LIANS_REF_PROTECTED: ${{ github.ref_protected }}
        run: python .github/scripts/check_publish_source.py
      - name: Require every published surface to match the tag
        run: python .github/scripts/check_release_versions.py "$GITHUB_REF_NAME"

  java-jar:
    name: Build Java jar
    needs: version-contract
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Package
        shell: bash
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          mvn -B --no-transfer-progress \
            -Dproject.build.outputTimestamp="${SOURCE_DATE_EPOCH}" package
        working-directory: agentmem/sdk/java
      - name: Attest jar provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: agentmem/sdk/java/target/*.jar
      - name: Attach jar to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: agentmem/sdk/java/target/*.jar

  c-tarball:
    name: Package C source
    needs: version-contract
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create tarball
        run: |
          version="${GITHUB_REF_NAME#v}"
          epoch="$(git show -s --format=%ct HEAD)"
          tar --sort=name --mtime="@${epoch}" --owner=0 --group=0 --numeric-owner \
            --pax-option=delete=atime,delete=ctime -C agentmem/sdk -cf - c \
            | gzip -n >"lians-c-${version}.tar.gz"
      - name: Attest source archive provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: lians-c-*.tar.gz
      - name: Attach tarball to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: lians-c-*.tar.gz

  go-tag:
    name: Tag Go module for go get
    needs: version-contract
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.22"
      - name: Build & vet
        run: go vet ./... && go build ./...
        working-directory: agentmem/sdk/go
      # The Go module lives in a subdirectory, so `go get <module>@<version>`
      # resolves a tag prefixed with the module path. Mirror the vX.Y.Z release
      # tag to agentmem/sdk/go/vX.Y.Z so consumers can pin a version.
      - name: Push module-path tag
        run: |
          set -euo pipefail
          gotag="agentmem/sdk/go/${GITHUB_REF_NAME}"
          release_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          remote_sha="$(git ls-remote --refs origin "refs/tags/$gotag" | awk '{print $1}')"
          if [[ -n "$remote_sha" ]]; then
            test "$remote_sha" = "$release_commit" || {
              echo "Refusing to reuse $gotag: remote points to $remote_sha, not $release_commit" >&2
              exit 1
            }
            echo "$gotag already points to the authorized release commit; skipping"
          else
            git tag "$gotag" "$release_commit"
            git push origin "refs/tags/$gotag:refs/tags/$gotag"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  maven-central:
    name: Publish to Maven Central
    needs: version-contract
    runs-on: ubuntu-latest
    # Opt-in: set repository variable PUBLISH_MAVEN_CENTRAL=true and configure the
    # OSSRH_* / MAVEN_GPG_* secrets first (see docs/publishing.md). Until then the
    # java-jar job attaches the jar to the Release.
    if: ${{ vars.PUBLISH_MAVEN_CENTRAL == 'true' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: central
          server-username: OSSRH_USERNAME
          server-password: OSSRH_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Deploy
        run: mvn -B --no-transfer-progress -P release deploy
        working-directory: agentmem/sdk/java
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
