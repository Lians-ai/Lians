name: Release SDK artifacts

# Cut a release by pushing a semver tag (e.g. v0.2.1). Builds the language
# artifacts and attaches them to the GitHub Release. Python and npm have their
# own publish workflows; this covers Java (jar) and C (source tarball), and
# sanity-builds Go. See docs/publishing.md.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing unified release tag to recover or republish (for example, v0.5.0)
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: sdk-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

jobs:
  release-context:
    name: Validate release context
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - name: Verify tag and source version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release_tag must be an existing stable semver tag (vX.Y.Z)" >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          source_version="$(tr -d '[:space:]' < VERSION)"
          if [[ "${source_version}" != "${version}" ]]; then
            echo "VERSION=${source_version} does not match ${RELEASE_TAG}" >&2
            exit 1
          fi
          tag_sha="$(git rev-list -n 1 "${RELEASE_TAG}")"
          head_sha="$(git rev-parse HEAD)"
          if [[ "${tag_sha}" != "${head_sha}" ]]; then
            echo "checked-out SHA ${head_sha} does not match ${RELEASE_TAG} (${tag_sha})" >&2
            exit 1
          fi
      - name: Create GitHub release if absent
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "GitHub Release ${RELEASE_TAG} already exists"
          else
            gh release create "${RELEASE_TAG}" \
              --verify-tag \
              --title "Lians ${RELEASE_TAG}" \
              --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  java-jar:
    name: Build Java jar
    needs: release-context
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Package
        run: mvn -B --no-transfer-progress package
        working-directory: agentmem/sdk/java
      - name: Attach jar to release
        shell: bash
        run: gh release upload "${RELEASE_TAG}" agentmem/sdk/java/target/*.jar --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  c-tarball:
    name: Package C source
    needs: release-context
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Create tarball
        run: |
          version="${RELEASE_TAG#v}"
          tar -czf "lians-c-${version}.tar.gz" -C agentmem/sdk c
      - name: Attach tarball to release
        shell: bash
        run: gh release upload "${RELEASE_TAG}" lians-c-*.tar.gz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lians-easy:
    name: Signed Lians Bridge (${{ matrix.os }})
    needs: release-context
    # Pull-request artifacts remain available for technical evaluation. Stable
    # Release assets are opt-in only and must pass the platform publisher gate
    # below before they can be uploaded for normal users.
    if: ${{ vars.PUBLISH_SIGNED_LIANS_DESKTOP == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Build standalone desktop runtime
        run: |
          python -m pip install packages/lians-easy pyinstaller==6.22.0
          data_separator=":"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            data_separator=";"
          fi
          extra_args=(
            --add-data "packages/lians-easy/lians_easy/app${data_separator}lians_easy/app"
          )
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            extra_args+=(
              --icon packages/lians-easy/windows-lians.ico
              --version-file packages/lians-easy/windows-version-info.txt
            )
          fi
          python -m PyInstaller --noconfirm --clean --onefile \
            --name LiansMemory \
            --paths packages/lians-easy \
            "${extra_args[@]}" \
            packages/lians-easy/entrypoint.py
        shell: bash
      - name: Verify frozen Lians App and Bridge API
        run: |
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            binary="dist/LiansMemory.exe"
          else
            binary="dist/LiansMemory"
          fi
          python packages/lians-easy/tests/artifact_app_smoke.py --binary "${binary}"
        shell: bash
      - name: Verify Windows package identity
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $info = (Get-Item -LiteralPath dist/LiansMemory.exe).VersionInfo
          $versionLine = Select-String -LiteralPath packages/lians-easy/pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $versionLine -or $versionLine.Line -notmatch '^version\s*=\s*"([^"]+)"') {
            throw 'Could not read the Lians Bridge package version'
          }
          $packageVersion = $Matches[1]
          $expected = @{
            CompanyName = 'Lians'
            FileDescription = 'Lians Bridge local AI memory'
            LegalCopyright = 'Copyright 2026 Lians'
            ProductName = 'Lians Bridge'
            OriginalFilename = 'LiansMemory.exe'
            FileVersion = $packageVersion
            ProductVersion = $packageVersion
          }
          foreach ($field in $expected.Keys) {
            if ($info.$field -ne $expected[$field]) {
              throw "$field was '$($info.$field)'; expected '$($expected[$field])'"
            }
          }
      - name: Verify frozen installer crash recovery
        run: |
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            binary="dist/LiansMemory.exe"
          else
            binary="dist/LiansMemory"
          fi
          python packages/lians-easy/tests/artifact_crash_smoke.py --binary "${binary}"
        shell: bash
      - name: Verify Windows Authenticode publisher gate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature -LiteralPath dist/LiansMemory.exe
          if ($signature.Status -ne 'Valid' -or -not $signature.SignerCertificate) {
            throw "Windows desktop publication requires a valid Authenticode signature; status was '$($signature.Status)'"
          }
          $signature.SignerCertificate | Select-Object Subject,Issuer,NotBefore,NotAfter,Thumbprint
      - name: Block incomplete macOS publisher path
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "macOS publication remains blocked until Developer ID signing, notarized DMG packaging, and staple validation are implemented." >&2
          exit 1
      - name: Block incomplete Linux publisher path
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "Linux publication remains blocked until the signed AppImage or Flatpak path is implemented." >&2
          exit 1
      - name: Name platform artifact and write checksum
        run: |
          set -euo pipefail
          platform="$(echo "${RUNNER_OS}" | tr '[:upper:]' '[:lower:]')"
          architecture="$(echo "${RUNNER_ARCH}" | tr '[:upper:]' '[:lower:]')"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            asset="LiansMemory-${platform}-${architecture}.exe"
            mv dist/LiansMemory.exe "${asset}"
          else
            executable="LiansMemory-${platform}-${architecture}"
            mv dist/LiansMemory "${executable}"
            chmod 0755 "${executable}"
            asset="${executable}.tar.gz"
            tar -czf "${asset}" "${executable}"
            rm "${executable}"
          fi
          python -c "import hashlib, pathlib; p=pathlib.Path('${asset}'); pathlib.Path(str(p)+'.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\\n')"
        shell: bash
      - name: Attach Lians Easy to release
        run: gh release upload "${RELEASE_TAG}" LiansMemory-* --clobber
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  go-tag:
    name: Tag Go module for go get
    needs: release-context
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.22"
      - name: Build & vet
        run: go vet ./... && go build ./...
        working-directory: agentmem/sdk/go
      # The Go module lives in a subdirectory, so `go get <module>@<version>`
      # resolves a tag prefixed with the module path. Mirror the vX.Y.Z release
      # tag to agentmem/sdk/go/vX.Y.Z so consumers can pin a version.
      - name: Push module-path tag
        run: |
          set -euo pipefail
          gotag="agentmem/sdk/go/${RELEASE_TAG}"
          target_sha="$(git rev-list -n 1 "${RELEASE_TAG}")"
          if git ls-remote --exit-code origin "refs/tags/${gotag}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${gotag}:refs/tags/${gotag}"
            existing_sha="$(git rev-list -n 1 "${gotag}")"
            if [[ "${existing_sha}" != "${target_sha}" ]]; then
              echo "${gotag} already points to ${existing_sha}, expected ${target_sha}" >&2
              exit 1
            fi
            echo "${gotag} already exists at the verified release commit"
          else
            git tag "${gotag}" "${target_sha}"
            git push origin "refs/tags/${gotag}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  maven-central:
    name: Publish to Maven Central
    needs: release-context
    runs-on: ubuntu-latest
    # Opt-in: set repository variable PUBLISH_MAVEN_CENTRAL=true and configure the
    # OSSRH_* / MAVEN_GPG_* secrets first (see docs/publishing.md). Until then the
    # java-jar job attaches the jar to the Release.
    if: ${{ vars.PUBLISH_MAVEN_CENTRAL == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: central
          server-username: OSSRH_USERNAME
          server-password: OSSRH_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Deploy
        run: mvn -B --no-transfer-progress -P release deploy
        working-directory: agentmem/sdk/java
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
