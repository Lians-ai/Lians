name: Release SDK artifacts

# Cut a release by pushing a semver tag (e.g. v0.2.1). Builds the language
# artifacts and attaches them to the GitHub Release. Python and npm have their
# own publish workflows; this covers Java (jar) and C (source tarball), and
# sanity-builds Go. See docs/publishing.md.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing unified release tag to recover or republish (for example, v0.5.0)
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: sdk-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

jobs:
  release-context:
    name: Validate release context
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - name: Verify tag and source version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release_tag must be an existing stable semver tag (vX.Y.Z)" >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          source_version="$(tr -d '[:space:]' < VERSION)"
          if [[ "${source_version}" != "${version}" ]]; then
            echo "VERSION=${source_version} does not match ${RELEASE_TAG}" >&2
            exit 1
          fi
          tag_sha="$(git rev-list -n 1 "${RELEASE_TAG}")"
          head_sha="$(git rev-parse HEAD)"
          if [[ "${tag_sha}" != "${head_sha}" ]]; then
            echo "checked-out SHA ${head_sha} does not match ${RELEASE_TAG} (${tag_sha})" >&2
            exit 1
          fi
      - name: Create GitHub release if absent
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "GitHub Release ${RELEASE_TAG} already exists"
          else
            gh release create "${RELEASE_TAG}" \
              --verify-tag \
              --title "Lians ${RELEASE_TAG}" \
              --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  java-jar:
    name: Build Java jar
    needs: release-context
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Package
        run: mvn -B --no-transfer-progress package
        working-directory: agentmem/sdk/java
      - name: Attach jar to release
        shell: bash
        run: gh release upload "${RELEASE_TAG}" agentmem/sdk/java/target/*.jar --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  c-tarball:
    name: Package C source
    needs: release-context
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Create tarball
        run: |
          version="${RELEASE_TAG#v}"
          tar -czf "lians-c-${version}.tar.gz" -C agentmem/sdk c
      - name: Attach tarball to release
        shell: bash
        run: gh release upload "${RELEASE_TAG}" lians-c-*.tar.gz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lians-easy:
    name: Signed Lians Bridge (Windows)
    needs: release-context
    # Pull-request artifacts remain available for technical evaluation. The
    # normal-user Windows package is opt-in and requires an exact publisher
    # certificate match before the release can receive any desktop asset.
    if: ${{ vars.PUBLISH_SIGNED_LIANS_DESKTOP == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Build standalone desktop runtime
        shell: pwsh
        run: |
          $versionLine = Select-String -LiteralPath packages/lians-easy/pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $versionLine -or $versionLine.Line -notmatch '^version\s*=\s*"([^"]+)"') {
            throw 'Could not read the Lians Bridge package version'
          }
          $packageVersion = $Matches[1]
          if ("v$packageVersion" -ne $env:RELEASE_TAG) {
            throw "Lians Bridge version $packageVersion does not match $env:RELEASE_TAG"
          }
          python -m pip install packages/lians-easy pyinstaller==6.22.0
          python -m PyInstaller --noconfirm --clean --onefile `
            --name LiansMemory `
            --paths packages/lians-easy `
            --add-data "packages/lians-easy/lians_easy/app;lians_easy/app" `
            --icon packages/lians-easy/windows-lians.ico `
            --version-file packages/lians-easy/windows-version-info.txt `
            packages/lians-easy/entrypoint.py
      - name: Verify frozen Lians App and Bridge API
        run: >-
          python packages/lians-easy/tests/artifact_app_smoke.py
          --binary dist/LiansMemory.exe
      - name: Verify Windows package identity
        shell: pwsh
        run: |
          $info = (Get-Item -LiteralPath dist/LiansMemory.exe).VersionInfo
          $versionLine = Select-String -LiteralPath packages/lians-easy/pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $versionLine -or $versionLine.Line -notmatch '^version\s*=\s*"([^"]+)"') {
            throw 'Could not read the Lians Bridge package version'
          }
          $packageVersion = $Matches[1]
          $expected = @{
            CompanyName = 'Lians'
            FileDescription = 'Lians Bridge local AI memory'
            LegalCopyright = 'Copyright 2026 Lians'
            ProductName = 'Lians Bridge'
            OriginalFilename = 'LiansMemory.exe'
            FileVersion = $packageVersion
            ProductVersion = $packageVersion
          }
          foreach ($field in $expected.Keys) {
            if ($info.$field -ne $expected[$field]) {
              throw "$field was '$($info.$field)'; expected '$($expected[$field])'"
            }
          }
      - name: Verify frozen installer crash recovery
        run: >-
          python packages/lians-easy/tests/artifact_crash_smoke.py
          --binary dist/LiansMemory.exe
      - name: Sign the Windows runtime
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_PFX_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
          WINDOWS_SIGNING_CERT_SHA1: ${{ vars.WINDOWS_SIGNING_CERT_SHA1 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_PASSWORD) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_SHA1)) {
            throw 'Windows signing requires the PFX secret, password secret, and expected SHA-1 certificate thumbprint variable'
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'lians-windows-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_PFX_BASE64))
            $password = ConvertTo-SecureString $env:WINDOWS_SIGNING_CERT_PASSWORD -AsPlainText -Force
            $expectedThumbprint = $env:WINDOWS_SIGNING_CERT_SHA1.Replace(' ', '').ToUpperInvariant()
            $imported = @(Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password)
            $matching = @($imported | Where-Object {
              $_.HasPrivateKey -and $_.Thumbprint.ToUpperInvariant() -eq $expectedThumbprint
            })
            if ($matching.Count -ne 1) {
              throw 'The PFX must contain exactly one private-key certificate matching WINDOWS_SIGNING_CERT_SHA1'
            }
            $certificate = $matching[0]
            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
              Select-Object -First 1
            if (-not $signTool) {
              throw 'Windows SDK signtool.exe was not found'
            }
            & $signTool.FullName sign /sha1 $certificate.Thumbprint /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist/LiansMemory.exe
            if ($LASTEXITCODE -ne 0) {
              throw "Runtime signing failed with exit code $LASTEXITCODE"
            }
            "LIANS_WINDOWS_CERT_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "LIANS_SIGNTOOL=$($signTool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }
      - name: Verify signed runtime publisher
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature -LiteralPath dist/LiansMemory.exe
          if ($signature.Status -ne 'Valid' -or -not $signature.SignerCertificate) {
            throw "Windows runtime requires a valid Authenticode signature; status was '$($signature.Status)'"
          }
          if ($signature.SignerCertificate.Thumbprint -ne $env:LIANS_WINDOWS_CERT_THUMBPRINT) {
            throw 'Windows runtime signer does not match the configured publisher certificate'
          }
      - name: Install pinned Windows packaging tool
        shell: pwsh
        run: |
          choco install nsis.install --version=3.12.0 --yes --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "NSIS installation failed with exit code $LASTEXITCODE"
          }
          $nsisCompiler = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path -LiteralPath $nsisCompiler)) {
            throw "NSIS compiler was not installed at the expected path: $nsisCompiler"
          }
          $nsisVersion = (& $nsisCompiler /VERSION).Trim()
          if ($nsisVersion -ne 'v3.12') {
            throw "Expected NSIS v3.12; found '$nsisVersion'"
          }
      - name: Build per-user Windows installer
        shell: pwsh
        run: >-
          & packages/lians-easy/scripts/build_windows_installer.ps1
          -Binary dist/LiansMemory.exe
          -OutputDirectory dist/installer
      - name: Sign and verify the Windows installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath dist/installer -Filter 'Lians-Setup-*.exe'
          if (@($installer).Count -ne 1) {
            throw 'Expected exactly one Lians Windows installer'
          }
          & $env:LIANS_SIGNTOOL sign /sha1 $env:LIANS_WINDOWS_CERT_THUMBPRINT /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $installer.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Installer signing failed with exit code $LASTEXITCODE"
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($signature.Status -ne 'Valid' -or -not $signature.SignerCertificate) {
            throw "Windows installer requires a valid Authenticode signature; status was '$($signature.Status)'"
          }
          if ($signature.SignerCertificate.Thumbprint -ne $env:LIANS_WINDOWS_CERT_THUMBPRINT) {
            throw 'Windows installer signer does not match the configured publisher certificate'
          }
      - name: Verify install, bundled app, and memory-preserving removal
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          python packages/lians-easy/tests/artifact_windows_installer_smoke.py `
            --installer "dist/installer/Lians-Setup-$version.exe" `
            --expected-version $version `
            --expected-signer-thumbprint $env:LIANS_WINDOWS_CERT_THUMBPRINT
      - name: Write Windows installer checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath dist/installer -Filter 'Lians-Setup-*.exe'
          $checksum = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  $($installer.Name)" | Set-Content -LiteralPath "$($installer.FullName).sha256" -Encoding utf8
      - name: Remove publisher certificate from the runner
        if: always()
        shell: pwsh
        run: |
          if ($env:LIANS_WINDOWS_CERT_THUMBPRINT) {
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$env:LIANS_WINDOWS_CERT_THUMBPRINT" -Force -ErrorAction SilentlyContinue
          }
      - name: Attach signed Lians Setup to release
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem -LiteralPath dist/installer -File | Where-Object {
            $_.Name -like 'Lians-Setup-*.exe' -or $_.Name -like 'Lians-Setup-*.exe.sha256'
          })
          if ($assets.Count -ne 2) {
            throw 'Expected one signed Windows installer and one SHA-256 checksum'
          }
          gh release upload $env:RELEASE_TAG @($assets.FullName) --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release upload failed with exit code $LASTEXITCODE"
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lians-easy-macos:
    name: Signed and notarized Lians (${{ matrix.architecture }})
    needs: release-context
    # A normal-user macOS asset exists only when the exact Developer ID
    # publisher and Apple's notary service both validate it. Pull requests use
    # separate ad-hoc-signed packages for technical lifecycle testing.
    if: ${{ vars.PUBLISH_SIGNED_LIANS_MACOS == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      MACOS_SIGNING_CERT_P12_BASE64: ${{ secrets.MACOS_SIGNING_CERT_P12_BASE64 }}
      MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
      MACOS_SIGNING_TEAM_ID: ${{ vars.MACOS_SIGNING_TEAM_ID }}
      APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
      APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Import the exact macOS publisher identity
        shell: bash
        run: |
          set -euo pipefail
          required=(
            MACOS_SIGNING_CERT_P12_BASE64
            MACOS_SIGNING_CERT_PASSWORD
            MACOS_SIGNING_IDENTITY
            MACOS_SIGNING_TEAM_ID
            APPLE_NOTARY_KEY_P8_BASE64
            APPLE_NOTARY_KEY_ID
            APPLE_NOTARY_ISSUER_ID
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "macOS publishing is missing $name" >&2
              exit 1
            fi
          done

          p12="$RUNNER_TEMP/lians-macos-signing-${{ matrix.architecture }}.p12"
          keychain="$RUNNER_TEMP/lians-macos-signing-${{ matrix.architecture }}.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$MACOS_SIGNING_CERT_P12_BASE64" | base64 -D > "$p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" \
            -k "$keychain" \
            -P "$MACOS_SIGNING_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain"
          security list-keychains -d user -s "$keychain"

          identities="$(security find-identity -v -p codesigning "$keychain")"
          matches="$(printf '%s\n' "$identities" | grep -F -c "\"$MACOS_SIGNING_IDENTITY\"" || true)"
          if [[ "$matches" != "1" ]]; then
            echo "The P12 must contain exactly one valid identity matching MACOS_SIGNING_IDENTITY" >&2
            exit 1
          fi
          rm -f "$p12"
          echo "LIANS_MAC_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "LIANS_MAC_KEYCHAIN_PASSWORD=$keychain_password" >> "$GITHUB_ENV"
      - name: Build Developer ID-signed standalone runtime
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("packages/lians-easy/pyproject.toml").read_text())["project"]["version"])')"
          if [[ "v$version" != "$RELEASE_TAG" ]]; then
            echo "Lians Bridge version $version does not match $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ "$(uname -m)" != "${{ matrix.architecture }}" ]]; then
            echo "Runner architecture $(uname -m) does not match ${{ matrix.architecture }}" >&2
            exit 1
          fi
          export MACOSX_DEPLOYMENT_TARGET=13.0
          python -m pip install packages/lians-easy pyinstaller==6.22.0 Pillow==11.3.0
          python -m PyInstaller --noconfirm --clean --onefile \
            --name LiansMemory \
            --paths packages/lians-easy \
            --add-data "packages/lians-easy/lians_easy/app:lians_easy/app" \
            --codesign-identity "$MACOS_SIGNING_IDENTITY" \
            packages/lians-easy/entrypoint.py
      - name: Verify signed frozen Lians App and crash recovery
        shell: bash
        run: |
          set -euo pipefail
          python packages/lians-easy/tests/artifact_app_smoke.py \
            --binary dist/LiansMemory
          python packages/lians-easy/tests/artifact_crash_smoke.py \
            --binary dist/LiansMemory
      - name: Build and verify Developer ID-signed DMG
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          bash packages/lians-easy/scripts/build_macos_dmg.sh \
            --binary dist/LiansMemory \
            --output-directory dist/installer \
            --version "$version" \
            --architecture "${{ matrix.architecture }}" \
            --signing-identity "$MACOS_SIGNING_IDENTITY"
          python packages/lians-easy/tests/artifact_macos_dmg_smoke.py \
            --dmg "dist/installer/Lians-$version-macos-${{ matrix.architecture }}.dmg" \
            --expected-version "$version" \
            --expected-architecture "${{ matrix.architecture }}" \
            --expected-signing-identity "$MACOS_SIGNING_IDENTITY" \
            --expected-team-id "$MACOS_SIGNING_TEAM_ID"
      - name: Notarize and staple the DMG
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          dmg="dist/installer/Lians-$version-macos-${{ matrix.architecture }}.dmg"
          notary_key="$RUNNER_TEMP/AuthKey_$APPLE_NOTARY_KEY_ID.p8"
          notary_result="$RUNNER_TEMP/lians-notary-${{ matrix.architecture }}.json"
          printf '%s' "$APPLE_NOTARY_KEY_P8_BASE64" | base64 -D > "$notary_key"
          chmod 600 "$notary_key"
          xcrun notarytool submit "$dmg" \
            --key "$notary_key" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait \
            --output-format json > "$notary_result"
          python - "$notary_result" <<'PY'
          import json
          import pathlib
          import sys

          result = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          if result.get("status") != "Accepted":
              raise SystemExit(f"Apple notarization was not accepted: {result}")
          print(f"Apple notarization accepted: {result.get('id', 'submission recorded')}")
          PY
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
      - name: Verify notarized package from the mounted release image
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          dmg="dist/installer/Lians-$version-macos-${{ matrix.architecture }}.dmg"
          python packages/lians-easy/tests/artifact_macos_dmg_smoke.py \
            --dmg "$dmg" \
            --expected-version "$version" \
            --expected-architecture "${{ matrix.architecture }}" \
            --expected-signing-identity "$MACOS_SIGNING_IDENTITY" \
            --expected-team-id "$MACOS_SIGNING_TEAM_ID" \
            --require-notarized
      - name: Write macOS package checksum
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          name="Lians-$version-macos-${{ matrix.architecture }}.dmg"
          (cd dist/installer && shasum -a 256 "$name" > "$name.sha256")
      - name: Attach signed and notarized macOS package to release
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          dmg="dist/installer/Lians-$version-macos-${{ matrix.architecture }}.dmg"
          gh release upload "$RELEASE_TAG" "$dmg" "$dmg.sha256" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove macOS publisher credentials from the runner
        if: always()
        shell: bash
        run: |
          if [[ -n "${LIANS_MAC_KEYCHAIN:-}" ]]; then
            security delete-keychain "$LIANS_MAC_KEYCHAIN" >/dev/null 2>&1 || true
          fi
          rm -f \
            "$RUNNER_TEMP/lians-macos-signing-${{ matrix.architecture }}.p12" \
            "$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID:-missing}.p8" \
            "$RUNNER_TEMP/lians-notary-${{ matrix.architecture }}.json"

  lians-easy-linux:
    name: Attested Lians Bridge (Linux x86_64)
    needs: release-context
    # AppImage has no operating-system publisher gate equivalent to Windows or
    # macOS. Keep publication opt-in and bind the exact artifact to GitHub's
    # OIDC-backed build provenance before it reaches a stable release.
    if: ${{ vars.PUBLISH_ATTESTED_LIANS_LINUX == 'true' }}
    runs-on: ubuntu-latest
    environment: linux-lians-desktop
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Verify exact desktop version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("packages/lians-easy/pyproject.toml").read_text())["project"]["version"])')"
          if [[ "v$version" != "$RELEASE_TAG" ]]; then
            echo "Lians Bridge version $version does not match $RELEASE_TAG" >&2
            exit 1
          fi
      - name: Build standalone Linux runtime
        run: |
          python -m pip install packages/lians-easy pyinstaller==6.22.0 Pillow==11.3.0
          python -m PyInstaller --noconfirm --clean --onefile \
            --name LiansMemory \
            --paths packages/lians-easy \
            --add-data "packages/lians-easy/lians_easy/app:lians_easy/app" \
            packages/lians-easy/entrypoint.py
      - name: Verify frozen Lians App and crash recovery
        run: |
          python packages/lians-easy/tests/artifact_app_smoke.py \
            --binary dist/LiansMemory
          python packages/lians-easy/tests/artifact_crash_smoke.py \
            --binary dist/LiansMemory
      - name: Install pinned Linux AppImage tool
        shell: bash
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/appimagetool-x86_64.AppImage"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage \
            --output "$tool"
          printf '%s  %s\n' \
            ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0 \
            "$tool" | sha256sum --check --strict
          chmod 0755 "$tool"
          runtime="$RUNNER_TEMP/appimage-runtime-x86_64"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64 \
            --output "$runtime"
          printf '%s  %s\n' \
            2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d \
            "$runtime" | sha256sum --check --strict
          echo "LIANS_APPIMAGETOOL=$tool" >> "$GITHUB_ENV"
          echo "LIANS_APPIMAGE_RUNTIME=$runtime" >> "$GITHUB_ENV"
      - name: Build and exercise install-free AppImage
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          python packages/lians-easy/scripts/create_macos_icon.py \
            --source packages/lians-easy/windows-lians.ico \
            --output dist/linux-iconset
          APPIMAGE_EXTRACT_AND_RUN=1 bash packages/lians-easy/scripts/build_linux_appimage.sh \
            --binary dist/LiansMemory \
            --icon dist/linux-iconset/icon_256x256.png \
            --output-directory dist/installer \
            --version "$version" \
            --architecture x86_64 \
            --appimagetool "$LIANS_APPIMAGETOOL" \
            --runtime-file "$LIANS_APPIMAGE_RUNTIME"
          python packages/lians-easy/tests/artifact_linux_appimage_smoke.py \
            --appimage "dist/installer/Lians-$version-linux-x86_64.AppImage" \
            --expected-version "$version" \
            --expected-architecture x86_64
      - name: Write exact Linux package checksum
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          name="Lians-$version-linux-x86_64.AppImage"
          (cd dist/installer && sha256sum "$name" > "$name.sha256")
      - name: Attest Linux package build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/installer/Lians-*-linux-x86_64.AppImage
      - name: Verify attestation and refuse an existing release asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          appimage="dist/installer/Lians-$version-linux-x86_64.AppImage"
          checksum="$appimage.sha256"
          gh attestation verify "$appimage" --repo "$GITHUB_REPOSITORY"
          existing="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          for asset in "$(basename "$appimage")" "$(basename "$checksum")"; do
            if grep --fixed-strings --line-regexp --quiet "$asset" <<< "$existing"; then
              echo "Refusing to overwrite existing release asset $asset" >&2
              exit 1
            fi
          done
      - name: Attach attested Linux package to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          appimage="dist/installer/Lians-$version-linux-x86_64.AppImage"
          gh release upload "$RELEASE_TAG" "$appimage" "$appimage.sha256"

  go-tag:
    name: Tag Go module for go get
    needs: release-context
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.22"
      - name: Build & vet
        run: go vet ./... && go build ./...
        working-directory: agentmem/sdk/go
      # The Go module lives in a subdirectory, so `go get <module>@<version>`
      # resolves a tag prefixed with the module path. Mirror the vX.Y.Z release
      # tag to agentmem/sdk/go/vX.Y.Z so consumers can pin a version.
      - name: Push module-path tag
        run: |
          set -euo pipefail
          gotag="agentmem/sdk/go/${RELEASE_TAG}"
          target_sha="$(git rev-list -n 1 "${RELEASE_TAG}")"
          if git ls-remote --exit-code origin "refs/tags/${gotag}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${gotag}:refs/tags/${gotag}"
            existing_sha="$(git rev-list -n 1 "${gotag}")"
            if [[ "${existing_sha}" != "${target_sha}" ]]; then
              echo "${gotag} already points to ${existing_sha}, expected ${target_sha}" >&2
              exit 1
            fi
            echo "${gotag} already exists at the verified release commit"
          else
            git tag "${gotag}" "${target_sha}"
            git push origin "refs/tags/${gotag}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  maven-central:
    name: Publish to Maven Central
    needs: release-context
    runs-on: ubuntu-latest
    # Opt-in: set repository variable PUBLISH_MAVEN_CENTRAL=true and configure the
    # OSSRH_* / MAVEN_GPG_* secrets first (see docs/publishing.md). Until then the
    # java-jar job attaches the jar to the Release.
    if: ${{ vars.PUBLISH_MAVEN_CENTRAL == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: central
          server-username: OSSRH_USERNAME
          server-password: OSSRH_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Deploy
        run: mvn -B --no-transfer-progress -P release deploy
        working-directory: agentmem/sdk/java
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
