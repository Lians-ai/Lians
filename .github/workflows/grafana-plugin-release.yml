name: Grafana plugin release

on:
  workflow_dispatch:
  push:
    tags:
      - "grafana-v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/grafana-lians-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrations/grafana-lians-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Package plugin
        run: |
          mkdir -p package/lians-lians-app
          cp -R dist/. package/lians-lians-app/
          cd package
          zip -r ../lians-lians-app.zip lians-lians-app
      - uses: actions/upload-artifact@v4
        with:
          name: lians-lians-app
          path: integrations/grafana-lians-app/lians-lians-app.zip
      - name: Attach to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: integrations/grafana-lians-app/lians-lians-app.zip
