name: Publish lians to PyPI

on:
  push:
    tags:
      - "v*"         # unified release tag — one `vX.Y.Z` ships every language
      - "lians-v*"   # Python-only tag (kept for back-compat)

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Authorize protected publication source
        env:
          LIANS_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          LIANS_REF_PROTECTED: ${{ github.ref_protected }}
        run: python .github/scripts/check_publish_source.py

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"

      - name: Require the tag to match package metadata
        run: python .github/scripts/check_release_versions.py "${GITHUB_REF_NAME#lians-v}"

      - name: Build hash-verified wheel and sdist
        run: >-
          uv build agentmem/sdk/python
          --build-constraint build-constraints.lock
          --require-hashes
          --out-dir dist

      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for OIDC trusted publishing
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
