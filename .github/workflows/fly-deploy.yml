name: Fly production deploy

on:
  workflow_run:
    workflows: ["Production image supply chain"]
    types: [completed]
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact current default-branch commit to redeploy
        required: true
        type: string
      supply_chain_run_id:
        description: Successful default-branch supply-chain run that produced the subject
        required: true
        type: string

concurrency:
  group: fly-production
  cancel-in-progress: false

permissions:
  actions: read
  attestations: read
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy verified immutable subject
    if: >-
      ${{
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == github.event.repository.default_branch &&
          github.event.workflow_run.head_repository.full_name == github.repository
        ) || (
          github.event_name == 'workflow_dispatch' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          github.sha == inputs.approved_sha
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Authorize the successful same-repository source run
        id: authorize
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          AUTOMATIC_RUN_ID: ${{ github.event.workflow_run.id }}
          AUTOMATIC_SHA: ${{ github.event.workflow_run.head_sha }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
          MANUAL_RUN_ID: ${{ inputs.supply_chain_run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_run ]]; then
            run_id="$AUTOMATIC_RUN_ID"
            source_sha="$AUTOMATIC_SHA"
          else
            [[ "$APPROVED_SHA" =~ ^[a-f0-9]{40}$ ]]
            [[ "$MANUAL_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
            test "$GITHUB_SHA" = "$APPROVED_SHA"
            run_id="$MANUAL_RUN_ID"
            source_sha="$APPROVED_SHA"
          fi
          [[ "$source_sha" =~ ^[a-f0-9]{40}$ ]]
          [[ "$run_id" =~ ^[1-9][0-9]*$ ]]
          run_json="$RUNNER_TEMP/supply-chain-run.json"
          gh api "repos/${REPOSITORY}/actions/runs/${run_id}" > "$run_json"
          jq -e \
            --arg repository "$REPOSITORY" \
            --arg branch "$DEFAULT_BRANCH" \
            --arg sha "$source_sha" '
              .name == "Production image supply chain"
              and .path == ".github/workflows/supply-chain.yml"
              and .event == "push"
              and .status == "completed"
              and .conclusion == "success"
              and .head_repository.full_name == $repository
              and .head_branch == $branch
              and .head_sha == $sha
            ' "$run_json" >/dev/null
          run_attempt="$(jq -er '.run_attempt | select(type == "number" and . >= 1)' "$run_json")"
          {
            echo "run_id=$run_id"
            echo "run_attempt=$run_attempt"
            echo "source_sha=$source_sha"
          } >> "$GITHUB_OUTPUT"
      - name: Download the verified deployment subject from that run
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.authorize.outputs.run_id }}
          RUN_ATTEMPT: ${{ steps.authorize.outputs.run_attempt }}
          SOURCE_SHA: ${{ steps.authorize.outputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fly-subject"
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "fly-production-image-${SOURCE_SHA}-attempt-${RUN_ATTEMPT}" \
            --dir "$RUNNER_TEMP/fly-subject"
      - name: Validate the closed deployment-subject contract
        id: subject
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.authorize.outputs.source_sha }}
          SOURCE_RUN_ID: ${{ steps.authorize.outputs.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.authorize.outputs.run_attempt }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/fly-subject"
          test -f "$directory/subject.txt" -a -f "$directory/subject.txt.sha256"
          (cd "$directory" && sha256sum --check --strict subject.txt.sha256)
          mapfile -t fields < "$directory/subject.txt"
          test "${#fields[@]}" -eq 4
          canonical_repository="${REPOSITORY,,}"
          expected_prefix="image_ref=ghcr.io/${canonical_repository}@"
          [[ "${fields[0]}" == "$expected_prefix"sha256:* ]]
          image_ref="${fields[0]#image_ref=}"
          digest="${image_ref##*@}"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          test "${fields[1]}" = "source_sha=${SOURCE_SHA}"
          test "${fields[2]}" = "workflow_run_id=${SOURCE_RUN_ID}"
          test "${fields[3]}" = "workflow_run_attempt=${SOURCE_RUN_ATTEMPT}"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"
      - name: Check out only the approved Fly configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.authorize.outputs.source_sha }}
          persist-credentials: false
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Authenticate read-only verification to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Re-verify signature and GitHub provenance without production credentials
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REF: ${{ steps.subject.outputs.image_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ steps.authorize.outputs.source_sha }}
        run: |
          set -euo pipefail
          cosign verify "$IMAGE_REF" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity "https://github.com/${REPOSITORY}/.github/workflows/supply-chain.yml@refs/heads/${DEFAULT_BRANCH}"
          gh attestation verify "oci://${IMAGE_REF}" \
            --repo "$REPOSITORY" \
            --signer-workflow "${REPOSITORY}/.github/workflows/supply-chain.yml" \
            --source-ref "refs/heads/${DEFAULT_BRANCH}" \
            --source-digest "$SOURCE_SHA" \
            --deny-self-hosted-runners
      - name: Set up Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5
        with:
          version: 0.4.77
      - name: Apply the reviewed schema with the isolated migrator identity
        shell: bash
        env:
          IMAGE_REF: ${{ steps.subject.outputs.image_ref }}
          MIGRATION_DATABASE_URL: ${{ secrets.FLY_MIGRATION_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$MIGRATION_DATABASE_URL"
          [[ "$IMAGE_REF" =~ @sha256:[a-f0-9]{64}$ ]]
          docker pull "$IMAGE_REF"
          docker run --rm \
            --env DATABASE_URL="$MIGRATION_DATABASE_URL" \
            --env MIGRATION_STATEMENT_TIMEOUT_MS=1500000 \
            --env MIGRATION_LOCK_TIMEOUT_MS=5000 \
            --env MIGRATION_IDLE_TRANSACTION_TIMEOUT_MS=300000 \
            "$IMAGE_REF" /bin/sh -ec '
              python -m lians.migration_preflight
              heads="$(alembic -c alembic.ini heads | awk "NF {print \$1}" | sort -u)"
              test "$(printf "%s\n" "$heads" | awk "NF {count++} END {print count+0}")" -eq 1
              alembic -c alembic.ini current >/dev/null
              alembic -c alembic.ini upgrade head
              python -m lians.migration_contract
            '
      - name: Deploy the already-built immutable image without a source build
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          IMAGE_REF: ${{ steps.subject.outputs.image_ref }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_REF" =~ @sha256:[a-f0-9]{64}$ ]]
          flyctl deploy --config fly.toml --image "$IMAGE_REF" --yes
