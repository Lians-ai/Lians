name: Production deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY to release master to production
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  authorize:
    name: Confirm production release
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$CONFIRM" = "DEPLOY"
          test "$REF_NAME" = "master"

  staging-gate:
    name: Recheck staging database
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Install read-only check dependency
        run: python -m pip install "asyncpg>=0.29,<1"

      - name: Verify staging through its private Fly tunnel
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail

          flyctl proxy 15432:5432 \
            --app agentmem-lotus-staging-db \
            --bind-addr 127.0.0.1 \
            --quiet \
            >"$RUNNER_TEMP/fly-staging-proxy.log" 2>&1 &
          proxy_pid=$!
          trap 'kill "$proxy_pid" 2>/dev/null || true' EXIT

          python - <<'PY'
          import socket
          import time

          deadline = time.monotonic() + 60
          while time.monotonic() < deadline:
              try:
                  with socket.create_connection(("127.0.0.1", 15432), timeout=1):
                      break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit("Fly staging proxy did not become ready within 60 seconds")
          PY

          python scripts/check_staging_database.py \
            --host 127.0.0.1 \
            --port 15432 \
            --expected-revision 0028_decision_envelopes

  deploy:
    name: Snapshot and deploy production
    needs: staging-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://agentmem-lotus.fly.dev
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Install migration dependencies
        run: >-
          python -m pip install
          "alembic>=1.13,<2"
          "sqlalchemy[asyncio]>=2.0.30,<3"
          "asyncpg>=0.29,<1"
          "pydantic-settings>=2.14,<3"
          "pgvector>=0.3,<1"

      - name: Record rollback image
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_APP_TOKEN }}
        run: |
          set -euo pipefail
          previous_image="$(
            flyctl releases --app agentmem-lotus --json |
              jq -er '[.[] | select(.Status == "complete")][0].ImageRef'
          )"
          case "$previous_image" in
            registry.fly.io/agentmem-lotus:deployment-*) ;;
            *) echo "Unexpected rollback image reference" >&2; exit 1 ;;
          esac
          echo "PREVIOUS_IMAGE=$previous_image" >> "$GITHUB_ENV"
          echo "Rollback image recorded in the protected job environment."

      - name: Create an immediate encrypted database snapshot
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DB_TOKEN }}
        run: |
          set -euo pipefail
          volumes="$(flyctl volumes list --app agentmem-lotus-db --json)"
          volume_count="$(jq 'length' <<<"$volumes")"
          test "$volume_count" -eq 1
          test "$(jq -r '.[0].encrypted' <<<"$volumes")" = "true"
          test "$(jq -r '.[0].state' <<<"$volumes")" = "created"
          volume_id="$(jq -er '.[0].id' <<<"$volumes")"

          before_snapshots="$(
            flyctl volumes snapshots list "$volume_id" \
              --app agentmem-lotus-db \
              --json
          )"
          before_snapshot_ids="$(jq -c '[.[].id]' <<<"$before_snapshots")"
          snapshot_started_at="$(date -u +%s)"

          # The Fly CLI can keep waiting after the control plane has already
          # created the snapshot. Start it asynchronously and treat the
          # snapshot list as the source of truth.
          snapshot_create_log="$RUNNER_TEMP/production-snapshot-create.log"
          flyctl volumes snapshots create "$volume_id" \
            --app agentmem-lotus-db \
            >"$snapshot_create_log" 2>&1 &
          snapshot_create_pid=$!

          cleanup_snapshot_create() {
            if [ -n "${snapshot_create_pid:-}" ]; then
              if kill -0 "$snapshot_create_pid" 2>/dev/null; then
                kill "$snapshot_create_pid" 2>/dev/null || true
              fi
              wait "$snapshot_create_pid" 2>/dev/null || true
            fi
          }
          trap cleanup_snapshot_create EXIT

          selected_snapshot=""
          for _ in $(seq 1 90); do
            snapshots="$(
              flyctl volumes snapshots list "$volume_id" \
                --app agentmem-lotus-db \
                --json
            )"
            selected_snapshot="$(
              jq -ec \
                --argjson before_ids "$before_snapshot_ids" \
                --argjson started_at "$snapshot_started_at" '
                map(select(.status == "created"))
                | map(
                    select(
                      .id as $id
                      | ($before_ids | index($id) | not)
                    )
                  )
                | sort_by(.created_at)
                | last
                | select(. != null)
                | . + {
                    created_epoch: (.created_at | fromdateiso8601),
                    age_seconds: (
                      (now - (.created_at | fromdateiso8601))
                      | floor
                    )
                  }
                | select(.created_epoch >= ($started_at - 30))
                | select(.age_seconds >= 0 and .age_seconds <= 600)
              ' <<<"$snapshots" || true
            )"
            if [ -n "$selected_snapshot" ]; then
              break
            fi
            if [ -n "${snapshot_create_pid:-}" ] && \
              ! kill -0 "$snapshot_create_pid" 2>/dev/null; then
              wait "$snapshot_create_pid" 2>/dev/null || true
              snapshot_create_pid=""
            fi
            sleep 2
          done

          cleanup_snapshot_create
          trap - EXIT
          snapshot_create_pid=""

          if [ -z "$selected_snapshot" ]; then
            echo "Fly did not confirm a new production snapshot." >&2
            cat "$snapshot_create_log" >&2 || true
            exit 1
          fi

          snapshot_id="$(jq -er '.id' <<<"$selected_snapshot")"
          snapshot_age_seconds="$(jq -er '.age_seconds' <<<"$selected_snapshot")"

          echo "Production database snapshot confirmed: $snapshot_id"
          echo "### Database safety" >> "$GITHUB_STEP_SUMMARY"
          echo "- Snapshot: \`$snapshot_id\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: new snapshot created by this deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Age: $snapshot_age_seconds seconds" >> "$GITHUB_STEP_SUMMARY"
          echo "- Volume: encrypted" >> "$GITHUB_STEP_SUMMARY"

      - name: Run migration through the private database tunnel
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DB_TOKEN }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          set -euo pipefail
          flyctl proxy 15433:5432 \
            --app agentmem-lotus-db \
            --bind-addr 127.0.0.1 \
            --quiet \
            >"$RUNNER_TEMP/fly-production-proxy.log" 2>&1 &
          proxy_pid=$!
          trap 'kill "$proxy_pid" 2>/dev/null || true' EXIT

          python - <<'PY'
          import socket
          import time

          deadline = time.monotonic() + 60
          while time.monotonic() < deadline:
              try:
                  with socket.create_connection(("127.0.0.1", 15433), timeout=1):
                      break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit("Fly production proxy did not become ready within 60 seconds")
          PY

          python scripts/migrate_via_fly_proxy.py --host 127.0.0.1 --port 15433

      - name: Deploy with canary health checks
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_APP_TOKEN }}
        run: |
          set -euo pipefail
          image_label="deployment-github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          deployed_image="registry.fly.io/agentmem-lotus:${image_label}"
          flyctl deploy \
            --app agentmem-lotus \
            --config fly.toml \
            --image-label "$image_label" \
            --build-arg "LIANS_BUILD_SHA=$GITHUB_SHA" \
            --remote-only \
            --strategy canary \
            --wait-timeout 10m
          echo "DEPLOYED_IMAGE=$deployed_image" >> "$GITHUB_ENV"

      - name: Resolve the production machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_APP_TOKEN }}
        run: |
          set -euo pipefail
          production_machine_id=""
          machines='[]'

          # flyctl deploy can return while the control plane briefly reports the
          # updated machine as "replacing". Poll until the newest complete
          # release and the only started machine both identify this exact build.
          for attempt in $(seq 1 60); do
            if ! releases="$(flyctl releases --app agentmem-lotus --json)"; then
              sleep 2
              continue
            fi
            if ! jq -e --arg image "$DEPLOYED_IMAGE" '
              length > 0
              and .[0].Status == "complete"
              and .[0].ImageRef == $image
            ' <<<"$releases" >/dev/null; then
              sleep 2
              continue
            fi

            if ! machines="$(
              flyctl machines list \
                --app agentmem-lotus \
                --json
            )"; then
              sleep 2
              continue
            fi

            set +e
            production_machine_id="$(
              python scripts/select_fly_production_machine.py \
                --expected-image "$DEPLOYED_IMAGE" \
                --expected-sha "$GITHUB_SHA" \
                <<<"$machines"
            )"
            selection_status=$?
            set -e
            if [ "$selection_status" -eq 0 ]; then
              break
            fi
            if [ "$selection_status" -ne 1 ]; then
              exit "$selection_status"
            fi
            if [ $((attempt % 10)) -eq 0 ]; then
              echo "Waiting for Fly to converge on the exact release (attempt $attempt/60)."
            fi
            sleep 2
          done

          if [ -z "$production_machine_id" ]; then
            echo "Fly did not converge on the exact healthy production release." >&2
            echo "Expected image: $DEPLOYED_IMAGE" >&2
            jq -c '[.[] | {
              id,
              state,
              image: .config.image,
              commit: .image_ref.labels.GH_SHA,
              host_status,
              cordoned,
              checks: [.checks[]? | {name, status}]
            }]' <<<"$machines" >&2
            exit 1
          fi

          echo "PRODUCTION_MACHINE_ID=$production_machine_id" >> "$GITHUB_ENV"
          echo "Resolved production machine $production_machine_id for $DEPLOYED_IMAGE."

      - name: Verify schema revision inside the production app
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_MACHINE_EXEC_TOKEN }}
        run: |
          set -euo pipefail
          output="$(
            flyctl machine exec \
              "$PRODUCTION_MACHINE_ID" \
              "/bin/sh -c 'cd /app/agentmem && /opt/venv/bin/alembic -c alembic.ini current'" \
              --app agentmem-lotus \
              --timeout 60 \
              2>&1
          )"
          printf '%s\n' "$output"
          revision="$(grep -oE '^0028_decision_envelopes' <<<"$output" | head -n 1)"
          test "$revision" = "0028_decision_envelopes"
          echo "Production schema revision: $revision"

      - name: Run public production smoke checks
        run: |
          python scripts/check_production_deployment.py \
            --base-url https://agentmem-lotus.fly.dev \
            --expected-build-sha "$GITHUB_SHA"

      - name: Publish rollback command
        if: always()
        run: |
          {
            echo "### Rollback"
            echo "If application rollback is needed, run the **Production rollback** workflow."
            echo "Use image: \`$PREVIOUS_IMAGE\`"
            echo "Do not downgrade the production database during incident response."
          } >> "$GITHUB_STEP_SUMMARY"
