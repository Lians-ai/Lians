name: CI

on:
  workflow_dispatch:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

permissions:
  contents: read

jobs:
  quality:
    name: Release, API, and dependency contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install release tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pip-audit
      - name: Verify synchronized release identity
        run: python scripts/check_release_contract.py
      - name: Verify public OpenAPI contract
        run: PYTHONPATH=agentmem/src python scripts/check_openapi_contract.py
      - name: Reject syntax and undefined-name defects
        run: python -m ruff check agentmem/src/lians agentmem/benchmarks scripts --select E9,F63,F7,F82
      - name: Compile runtime and release scripts
        run: python -m compileall -q agentmem/src/lians agentmem/benchmarks scripts
      - name: Audit production Python dependencies
        run: python -m pip_audit --local --skip-editable

  memory-intelligence:
    name: Memory intelligence safety gates
    runs-on: ubuntu-latest
    env:
      EMBEDDING_PROVIDER: local
      MASTER_ENCRYPTION_KEY: ""
      AGENTMEM_ALLOW_UNENCRYPTED: "true"
      RECALL_CACHE_ENABLED: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: pip install -e ".[dev]"
      - name: Verify migration graph
        run: test "$(alembic heads | wc -l)" -eq 1
        working-directory: agentmem
      - name: Run memory intelligence gates
        run: |
          PYTHONPATH=agentmem/src python -m pytest \
            agentmem/tests/test_adaptive_recall.py \
            agentmem/tests/test_context.py \
            agentmem/tests/test_degraded_retrieval.py \
            agentmem/tests/test_recall_limits.py \
            agentmem/tests/test_scheduler.py \
            agentmem/tests/test_sso_barrier.py -q
          PYTHONPATH=agentmem/sdk/python:agentmem python -m pytest \
            agentmem/tests/test_memory_feedback.py \
            agentmem/tests/test_memory_intelligence_integrations.py -q
      - name: Run deterministic tenant-isolation soak
        run: |
          python agentmem/benchmarks/memory_intelligence_soak.py \
            --tenants 3 --memories 10 --workers 3 \
            --db "$RUNNER_TEMP/memory-intelligence-soak.db" \
            --out "$RUNNER_TEMP/memory-intelligence-soak.json"
      - name: Run reproducible foundation evidence gates
        working-directory: agentmem
        run: |
          PYTHONPATH=src python -m benchmarks.evidence_suite
          PYTHONPATH=src python -m benchmarks.release_claims \
            --out results/claim-evidence-latest.json \
            --require foundation_verified
      - name: Preserve foundation evidence receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-foundation-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            agentmem/results/evidence-suite-latest.json
            agentmem/results/claim-evidence-latest.json

  # ── Python test suite ───────────────────────────────────────────────────────
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
        env:
          POSTGRES_USER: agentmem
          POSTGRES_PASSWORD: agentmem
          POSTGRES_DB: agentmem
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentmem"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://agentmem:agentmem@localhost:5432/agentmem
      TEST_DATABASE_URL: postgresql+asyncpg://agentmem:agentmem@localhost:5432/agentmem
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/0
      EMBEDDING_PROVIDER: local
      MASTER_ENCRYPTION_KEY: ""
      AGENTMEM_ALLOW_UNENCRYPTED: "true"
      ADMIN_SECRET: dev-admin-secret-change-in-prod
      RECALL_CACHE_ENABLED: "true"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"
        working-directory: .

      - name: Run Alembic migrations
        run: alembic upgrade head
        working-directory: agentmem
        env:
          DATABASE_URL: postgresql+asyncpg://agentmem:agentmem@localhost:5432/agentmem

      - name: Run pytest
        run: |
          PYTHONPATH=agentmem/src python -m pytest agentmem/tests/ -v --tb=short \
            --ignore=agentmem/tests/test_compaction_flush.py \
            --ignore=agentmem/tests/test_compare_regulated.py \
            --ignore=agentmem/tests/test_distill_ingest.py \
            --ignore=agentmem/tests/test_eval_harness.py \
            --ignore=agentmem/tests/test_graph.py \
            --ignore=agentmem/tests/test_harness.py \
            --ignore=agentmem/tests/test_langchain.py \
            --ignore=agentmem/tests/test_memory_feedback.py \
            --ignore=agentmem/tests/test_memory_intelligence_integrations.py \
            --ignore=agentmem/tests/test_mcp_local.py \
            --ignore=agentmem/tests/test_regulated_eval.py \
            --ignore=agentmem/tests/test_sdk.py \
            --ignore=agentmem/tests/test_sdk_extended.py \
            --ignore=agentmem/tests/test_sdk_retry.py
          PYTHONPATH=agentmem/sdk/python:agentmem python -m pytest \
            agentmem/tests/test_compaction_flush.py \
            agentmem/tests/test_compare_regulated.py \
            agentmem/tests/test_distill_ingest.py \
            agentmem/tests/test_eval_harness.py \
            agentmem/tests/test_graph.py \
            agentmem/tests/test_harness.py \
            agentmem/tests/test_langchain.py \
            agentmem/tests/test_memory_feedback.py \
            agentmem/tests/test_memory_intelligence_integrations.py \
            agentmem/tests/test_mcp_local.py \
            agentmem/tests/test_regulated_eval.py \
            agentmem/tests/test_sdk.py \
            agentmem/tests/test_sdk_extended.py \
            agentmem/tests/test_sdk_retry.py -v --tb=short
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://agentmem:agentmem@localhost:5432/agentmem

  # ── TypeScript SDK tests ────────────────────────────────────────────────────
  typescript:
    name: TypeScript SDK (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "20", "22"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: agentmem/sdk/typescript/package.json

      - name: Install dependencies
        run: npm install
        working-directory: agentmem/sdk/typescript

      - name: Run Jest tests
        run: npm test
        working-directory: agentmem/sdk/typescript

  # ── Java SDK tests ──────────────────────────────────────────────────────────
  java:
    name: Java SDK (Temurin ${{ matrix.java-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        java-version: ["11", "17", "21"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      - name: Build & test
        run: mvn -B --no-transfer-progress verify
        working-directory: agentmem/sdk/java

  # ── C SDK tests ─────────────────────────────────────────────────────────────
  c:
    name: C SDK (CMake)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install libcurl dev headers
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
        working-directory: agentmem/sdk/c

      - name: Build
        run: cmake --build build
        working-directory: agentmem/sdk/c

      - name: Test (pure helpers)
        run: ctest --test-dir build --output-on-failure
        working-directory: agentmem/sdk/c

  # ── Go SDK tests ────────────────────────────────────────────────────────────
  go:
    name: Go SDK (${{ matrix.go-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.21", "1.22", "1.23"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ matrix.go-version }}

      - name: Vet
        run: go vet ./...
        working-directory: agentmem/sdk/go

      - name: Test
        run: go test ./...
        working-directory: agentmem/sdk/go

  runtime-container:
    name: Production runtime container
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build production image without the optional local model
        run: >-
          docker build
          --build-arg EXTRAS=
          --build-arg PREDOWNLOAD_MODEL=
          --tag lians-runtime:test
          .

      - name: Verify non-root runtime and application import
        run: |
          test "$(docker image inspect lians-runtime:test --format '{{.Config.User}}')" = "10001:10001"
          docker run --rm lians-runtime:test python -c "import lians.main"

  mcp-container:
    name: Glama MCP container
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Build Glama image
        run: |
          version="$(python -c 'import json; print(json.load(open("docs/published-release-status.json"))["artifacts"]["ghcr_mcp"]["version"])')"
          docker build \
            --file Dockerfile.glama \
            --build-arg "LIANS_VERSION=$version" \
            --tag lians-mcp-glama:test \
            .

      - name: Install MCP test client
        run: pip install "mcp>=1,<2"

      - name: Initialize server and list tools
        run: python .github/scripts/smoke_mcp_container.py
