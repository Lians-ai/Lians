name: Public repository boundary

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  public-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify public and commercial source boundary
        run: python scripts/check_public_boundary.py
