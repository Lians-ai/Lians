name: Publish lians to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact unpublished lock-step version to publish
        required: true
        default: 0.5.0
  push:
    tags:
      - "v*"            # unified release tag; one `vX.Y.Z` ships every language
      - "lians-ts-v*"   # TypeScript-only tag kept for backward compatibility

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Authorize protected publication source
        env:
          LIANS_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          LIANS_REF_PROTECTED: ${{ github.ref_protected }}
        run: python .github/scripts/check_publish_source.py

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        working-directory: agentmem/sdk/typescript
        run: npm ci

      - name: Require the tag to match package metadata
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            expected="${GITHUB_REF_NAME#lians-ts-v}"
          else
            expected="${{ inputs.version }}"
          fi
          python .github/scripts/check_release_versions.py "$expected"

      - name: Build
        working-directory: agentmem/sdk/typescript
        run: npm run build

      - name: Test
        working-directory: agentmem/sdk/typescript
        run: npm test

      - name: Publish to npm
        working-directory: agentmem/sdk/typescript
        run: npm publish --access public --provenance
