name: Lians Check feedback
description: Tell us whether setup and your first evidence-backed check worked.
title: "lians check: "
labels: [documentation]
body:
  - type: markdown
    attributes:
      value: Thanks for trying Lians. Do not include project secrets, credentials, personal data, or confidential memory values.
  - type: dropdown
    id: client
    attributes:
      label: AI tool
      options:
        - Codex
        - Claude Code
        - Cursor
        - Another coding agent
    validations:
      required: true
  - type: dropdown
    id: outcome
    attributes:
      label: First-run outcome
      options:
        - READY TO REVIEW
        - NEEDS WORK correctly identified a failure
        - Lians could not detect the right checks
        - Installation or setup did not finish
        - I am not sure
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: What were you trying to do?
      placeholder: Set up Lians Check and verify AI-generated work in a Git repository.
    validations:
      required: true
  - type: textarea
    id: blocker
    attributes:
      label: What happened?
      description: Include what felt clear or unclear. If something failed, include the step, what you expected, and what happened instead. Use synthetic values in examples.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Lians version or commit
      placeholder: Package version or commit SHA, if known
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS, Windows, or Linux; AI tool version if known
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, personal data, and confidential project information.
          required: true
