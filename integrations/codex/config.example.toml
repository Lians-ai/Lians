# Lians MCP server for Codex CLI
#
# Add this block to your Codex config (~/.codex/config.toml) to expose Lians as a
# native MCP tool server. Codex will gain the eight Lians memory tools without any
# SDK code in your project.
#
# Requires `uvx` (ships with `uv`): https://docs.astral.sh/uv/
# Install uv, then Codex launches the server on demand via the command below.

[mcp_servers.lians]
command = "uvx"
args = ["--from", "lians-sdk[mcp]", "lians-mcp"]
startup_timeout_sec = 300
tool_timeout_sec = 120
enabled = true
# Wait for tool discovery before starting a turn. Local embedding prewarm can
# otherwise race a fast model response on a fresh Codex process.
required = true
enabled_tools = ["remember", "recall", "recall_at"]
default_tools_approval_mode = "writes"

[mcp_servers.lians.env]
# Point at the managed cloud (free tier) or your self-hosted server.
LIANS_URL = "https://api.lians.dev"
# Get a free key at api.lians.dev, or use your self-hosted key.
LIANS_API_KEY = "lians_..."
# Memory namespace for this agent/session.
LIANS_AGENT_ID = "codex-session"

# ── Local mode (no server, no API key) ─────────────────────────────────────────
# For prototyping you can omit LIANS_URL / LIANS_API_KEY and run the local SQLite
# backend instead:
#
#   [mcp_servers.lians]
#   command = "uvx"
#   args = ["--from", "lians-sdk[mcp]", "lians-mcp"]
#   startup_timeout_sec = 300
#   tool_timeout_sec = 120
#   required = true
#   enabled_tools = ["remember", "recall", "recall_at"]
#   default_tools_approval_mode = "writes"
#   [mcp_servers.lians.env]
#   LIANS_AGENT_ID = "codex-session"
#   LIANS_NAMESPACE = "codex-personal"
#   LIANS_LOCAL_DB = "/absolute/path/to/.lians/codex.db"
#   EMBEDDING_PROVIDER = "sentence-transformers"
#
# The local MCP server prewarms before accepting traffic. The longer startup
# timeout covers the first model download; warm tool calls use tool_timeout_sec.
# If the model is already cached for an air-gapped host, add HF_HUB_OFFLINE = "1".
#
# Evidence profile: replace enabled_tools above with all eight server tools:
# ["remember", "recall", "recall_at", "reconstruct", "list_conflicts",
#  "memory_lineage", "fact_history", "backtest_check"]
