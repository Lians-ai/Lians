# Lians local memory for Codex
#
# Add this block to ~/.codex/config.toml. Requires uv/uvx:
# https://docs.astral.sh/uv/getting-started/installation/

[mcp_servers.lians]
command = "uvx"
args = ["--from", "lians-sdk[mcp]", "lians-memory-mcp"]

[mcp_servers.lians.env]
# Optional local overrides:
# LIANS_LOCAL_DB = "~/.lians/mcp.db"
# LIANS_AGENT_ID = "codex"
# LIANS_NAMESPACE = "codex"

# To use a hosted or self-hosted Lians service, add:
# LIANS_URL = "https://memory.example.com"
# LIANS_API_KEY = "lians_..."
