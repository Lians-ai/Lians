# Public API application credentials. Keep database, Redis, KMS, receipt,
# Recorder-ingest, migration, and administration credentials out of this object.
apiVersion: v1
kind: Secret
metadata:
  name: agentmem-application
  namespace: agentmem
  labels:
    app.kubernetes.io/name: agentmem
    app.kubernetes.io/component: api
type: Opaque
stringData:
  SUBJECT_REFERENCE_KEY: "CHANGE_ME_base64_or_hex_32_bytes"
  METRICS_BEARER_TOKEN: "CHANGE_ME_random_32_plus_character_metrics_token"
  VOYAGE_API_KEY: ""
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  STRIPE_API_KEY: ""
