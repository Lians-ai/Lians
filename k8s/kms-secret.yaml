# Configure only the selected external KMS provider. These placeholder keys are
# intentionally empty and must be supplied through managed secret/workload identity.
apiVersion: v1
kind: Secret
metadata:
  name: agentmem-kms
  namespace: agentmem
  labels:
    app.kubernetes.io/name: agentmem
    app.kubernetes.io/component: kms
type: Opaque
stringData:
  KMS_AWS_REGION: "us-east-1"
  KMS_AWS_ENCRYPTED_KEY: ""
  KMS_AWS_KEY_ID: ""
  KMS_AWS_PREVIOUS_REGION: ""
  KMS_AWS_PREVIOUS_ENCRYPTED_KEY: ""
  KMS_AWS_PREVIOUS_KEY_ID: ""
  KMS_AZURE_VAULT_URL: ""
  KMS_AZURE_SECRET_NAME: "agentmem-master-key"
  KMS_AZURE_PREVIOUS_VAULT_URL: ""
  KMS_AZURE_PREVIOUS_SECRET_NAME: ""
  KMS_VAULT_ADDR: ""
  KMS_VAULT_TOKEN: ""
  KMS_VAULT_PATH: "agentmem/master-key"
  KMS_VAULT_MOUNT_POINT: "secret"
  KMS_VAULT_PREVIOUS_ADDR: ""
  KMS_VAULT_PREVIOUS_PATH: ""
  KMS_VAULT_PREVIOUS_MOUNT_POINT: ""
