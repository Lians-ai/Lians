apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentmem-api
  namespace: agentmem
  labels:
    app.kubernetes.io/name: agentmem
    app.kubernetes.io/component: api
  annotations:
    # Replace with exactly one platform-specific workload-identity annotation
    # when the selected KMS/provider requires it. This inert marker grants no
    # cloud authority and keeps the reference fail closed.
    lians.ai/workload-identity: configure-me
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentmem-migrator
  namespace: agentmem
  labels:
    app.kubernetes.io/name: agentmem
    app.kubernetes.io/component: migrate
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lians-otel-collector
  namespace: agentmem
  labels:
    app.kubernetes.io/name: lians-otel-collector
    app.kubernetes.io/component: recorder-gateway
automountServiceAccountToken: false
