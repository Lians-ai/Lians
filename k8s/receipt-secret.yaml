# Local receipt-signing material. Prefer a separately governed Vault Transit
# token-file projection for production environments that support it.
apiVersion: v1
kind: Secret
metadata:
  name: agentmem-receipt-signing
  namespace: agentmem
  labels:
    app.kubernetes.io/name: agentmem
    app.kubernetes.io/component: receipt-signing
type: Opaque
stringData:
  RECEIPT_SIGNING_PRIVATE_KEY: "CHANGE_ME_base64_or_hex_32_byte_ed25519_private_key"
