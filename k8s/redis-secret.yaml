# Authenticated hostname-verifying Redis transport for the public API.
apiVersion: v1
kind: Secret
metadata:
  name: agentmem-redis
  namespace: agentmem
  labels:
    app.kubernetes.io/name: agentmem
    app.kubernetes.io/component: redis-runtime
type: Opaque
stringData:
  REDIS_URL: "rediss://:CHANGE_ME@redis.example.invalid:6379/0"
