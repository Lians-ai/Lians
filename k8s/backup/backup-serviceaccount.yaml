apiVersion: v1
kind: ServiceAccount
metadata:
  name: lians-backup-worm
  labels:
    app.kubernetes.io/name: agentmem
    app.kubernetes.io/component: backup
  annotations:
    # Replace with exactly one platform-specific workload identity binding.
    # AWS: eks.amazonaws.com/role-arn
    # GKE: iam.gke.io/gcp-service-account
    # Azure: azure.workload.identity/client-id (and add the provider-required Pod label)
    lians.ai/workload-identity: configure-me
automountServiceAccountToken: false
