apiVersion: v1
kind: Secret
metadata:
  name: lians-backup-credentials
  namespace: agentmem
type: Opaque
stringData:
  # Use a dedicated LOGIN role with CONNECT plus read access required by
  # pg_dump. It must not own schemas, bypass RLS, or mutate application data.
  PGHOST: "CHANGE_ME-managed-postgres.example.internal"
  PGPORT: "5432"
  PGDATABASE: "agentmem"
  PGUSER: "lians_backup"
  # libpq format: hostname:port:database:username:password
  pgpass: "CHANGE_ME-managed-postgres.example.internal:5432:agentmem:lians_backup:CHANGE_ME"
  # Provider CA chain used with PGSSLMODE=verify-full.
  ca.crt: |
    -----BEGIN CERTIFICATE-----
    CHANGE_ME
    -----END CERTIFICATE-----
  # Immutable managed-database resource identifier, not a mutable hostname.
  LIANS_DATABASE_ID: "CHANGE_ME-provider-database-resource-id"
  WORM_DESTINATION: "s3://CHANGE_ME-lians-backups/production"
