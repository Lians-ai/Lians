# Lians non-owner runtime database credential.
#
# This checked-in object is a non-runnable shape example. In production, create
# the Secret through an external-secret controller. Keep the migration owner,
# application/provider credentials, receipt signer, KMS material, Recorder key,
# and break-glass credential in their independently governed objects.
apiVersion: v1
kind: Secret
metadata:
  name: agentmem-database-runtime
  namespace: agentmem
  labels:
    app.kubernetes.io/name: agentmem
    app.kubernetes.io/component: database-runtime
type: Opaque
stringData:
  # A non-owner NOSUPERUSER/NOBYPASSRLS login inheriting only lians_runtime.
  DATABASE_URL: "postgresql+asyncpg://lians_app:CHANGE_ME@postgres.example.invalid:5432/agentmem?sslmode=verify-full"
