# Lians break-glass administration credential.
#
# This object is intentionally excluded from kustomization.yaml. Project it only
# into a separately isolated API_SURFACE=admin workload with private ingress,
# restrictive egress, strong operator authentication, and alerting on every use.
# Never mount it in the public Deployment.
apiVersion: v1
kind: Secret
metadata:
  name: agentmem-admin-secret
  namespace: agentmem
  labels:
    app.kubernetes.io/name: agentmem
    app.kubernetes.io/component: admin
type: Opaque
stringData:
  ADMIN_SECRET: "CHANGE_ME_distinct_break_glass_secret"
