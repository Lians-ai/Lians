# Kustomize entry point. Read k8s/README.md before applying; the Secret and
# migration Job are intentionally external to this default bundle.
#
# Deployment order matters:
# 1. kubectl apply -f k8s/namespace.yaml
# 2. Create agentmem-secret through your secrets manager or private env file
# 3. Pin the image by digest in this file and k8s/migrate-job.yaml
# 4. Apply and wait for k8s/migrate-job.yaml
# 5. Inspect `kubectl kustomize k8s/`, then apply it
#
# A mutable tag is useful only for source evaluation. Production must replace
# the tag with the verified GHCR digest emitted by the publication workflow.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agentmem

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
  # migrate-job.yaml is intentionally excluded here — run it manually before
  # each deployment to avoid applying the job on every `kubectl apply -k`.

# Image candidate. It becomes a supported install path only after this exact
# version is published and verified in GHCR.
images:
  - name: agentmem
    newName: ghcr.io/lians-ai/lians-engine
    newTag: "0.5.0"

labels:
  - pairs:
      app.kubernetes.io/version: "0.5.0"
      app.kubernetes.io/managed-by: kustomize
    # Version labels must never enter immutable Deployment selectors.
    includeSelectors: false
