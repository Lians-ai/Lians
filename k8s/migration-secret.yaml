# Lians one-shot migration credential.
#
# Apply this object only for the controlled migration window, then remove it
# after the Job has completed and its evidence has been retained. Do not add
# this file to kustomization.yaml and do not project it into an API pod.
# In production, prefer an external-secret controller with an independently
# approved, short-lived credential over this checked-in placeholder.
apiVersion: v1
kind: Secret
metadata:
  name: agentmem-migration-secret
  namespace: agentmem
  labels:
    app.kubernetes.io/name: agentmem
    app.kubernetes.io/component: migrate
type: Opaque
stringData:
  # The login must own (or be granted the narrowly reviewed DDL privileges for)
  # Lians application objects, remain NOSUPERUSER/NOBYPASSRLS, and must not
  # inherit or be able to SET ROLE to `lians_runtime`.
  # Format: postgresql+asyncpg://<migrator-user>:<password>@<host>:<port>/<db>?sslmode=verify-full
  DATABASE_URL: "postgresql+asyncpg://lians_migrator:CHANGE_ME@postgres.example.invalid:5432/agentmem?sslmode=verify-full"
