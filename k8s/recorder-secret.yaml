# Namespace-scoped Recorder ingest key. The collector must not receive the API's
# database, receipt, KMS, provider, metrics, or administration credentials.
apiVersion: v1
kind: Secret
metadata:
  name: agentmem-recorder-ingest
  namespace: agentmem
  labels:
    app.kubernetes.io/name: agentmem
    app.kubernetes.io/component: recorder-ingest
type: Opaque
stringData:
  LIANS_INGEST_API_KEY: "CHANGE_ME_namespace_scoped_recorder_write_key"
