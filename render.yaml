services:
  - type: web
    name: agentmem-api
    runtime: python
    plan: standard
    region: oregon
    branch: master
    buildCommand: pip install -e ".[otel,metrics]"
    # Render provides a bare postgresql:// URL, but the app's parse_db_url()
    # expects postgresql+asyncpg:// (SQLAlchemy async). Rewrite the scheme in
    # both the migration and start commands. Migrations run here (preDeploy),
    # from inside agentmem/ because alembic.ini uses relative paths.
    preDeployCommand: export DATABASE_URL=$(echo "$DATABASE_URL" | sed 's#postgresql://#postgresql+asyncpg://#') && export PYTHONPATH=$PWD/agentmem/src && cd agentmem && alembic -c alembic.ini upgrade head
    startCommand: export DATABASE_URL=$(echo "$DATABASE_URL" | sed 's#postgresql://#postgresql+asyncpg://#') && uvicorn lians.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DEPLOYMENT_ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: agentmem-pg
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: agentmem-redis
          type: redis
          property: connectionString
      - key: EMBEDDING_PROVIDER
        value: local
      - key: MASTER_ENCRYPTION_KEY
        generateValue: true  # base64 256-bit — decodes to 32 bytes; pinned forever
      - key: ADMIN_SECRET
        sync: false          # full administrative control; never share with the website
      - key: PROVISIONING_SECRET
        sync: false          # separate namespace-bound website provisioning credential
      - key: API_SECRET_SEED
        generateValue: true  # retained for deployment compatibility
      - key: CORS_ORIGINS
        value: "https://lians.ai,https://www.lians.ai"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPERSESSION_LLM_STAGE
        value: "true"
      - key: GRAPH_EXTRACT_LLM
        value: "true"          # enable opt-in LLM graph extraction (use_llm=true)
      - key: RECALL_CACHE_ENABLED
        value: "true"
      - key: RECALL_CACHE_TTL_SECONDS
        value: "60"
      - key: SUPERSESSION_REVIEW_THRESHOLD
        value: "0.75"
      - key: OTEL_SERVICE_NAME
        value: agentmem
      - key: PYTHONPATH
        value: agentmem/src
      - key: HOSTED_MCP_ENABLED
        value: "false"
      - key: HOSTED_MCP_RESOURCE_URL
        value: https://mcp.lians.ai
      - key: HOSTED_MCP_SERVICE_DOCUMENTATION_URL
        value: https://www.lians.ai/privacy
      - key: HOSTED_MCP_STARTUP_TIMEOUT_SECONDS
        value: "360"
      - key: HOSTED_MCP_TOOL_TIMEOUT_SECONDS
        value: "30"
      - key: HOSTED_MCP_MAX_CONCURRENT_INFERENCE
        value: "1"
      - key: HOSTED_MCP_INFERENCE_QUEUE_TIMEOUT_SECONDS
        value: "0.1"
      - key: HOSTED_MCP_RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: HOSTED_MCP_MAX_MEMORIES_PER_TENANT
        value: "10000"
      - key: HOSTED_MCP_MAX_STORED_BYTES_PER_TENANT
        value: "40000000"
      - key: HOSTED_MCP_MAX_WRITE_BYTES_PER_DAY
        value: "1000000"
      - key: HOSTED_MCP_MAX_AUDIT_EVENTS_PER_DAY
        value: "5000"
      - key: HOSTED_MCP_TENANT_CLAIM
        value: tenant_id
      - key: HOSTED_MCP_MAX_TOKEN_LIFETIME_SECONDS
        value: "3600"
      - key: HOSTED_MCP_ISSUER_URL
        sync: false
      - key: HOSTED_MCP_JWKS_URL
        sync: false
      - key: OPENAI_APPS_CHALLENGE_TOKEN
        sync: false

  # Redis is a service (type: redis), not a database entry.
  - type: redis
    name: agentmem-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []          # empty = internal-only (no public access)

databases:
  # Postgres plan slugs are basic-256mb / basic-1gb / pro-* — NOT "standard".
  - name: agentmem-pg
    plan: basic-256mb
    region: oregon
    databaseName: agentmem
    user: agentmem
